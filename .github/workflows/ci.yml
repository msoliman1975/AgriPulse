name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-progress run when a new commit is pushed to the same PR/branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          # No `cache: pip` here â€” it requires a requirements.txt or
          # pyproject.toml to exist to hash for the cache key. Backend's
          # pyproject.toml lands in PR 2; the pre-commit env cache below
          # is the one that actually matters at this stage.

      - name: Install pre-commit
        run: pip install pre-commit==3.8.0

      - name: Restore pre-commit env cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  backend:
    name: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Pinned to match the local-dev minimum and the lockfile's
          # `revision = 3` format.
          version: "0.11.2"

      - name: Set up Python
        run: uv python install 3.12

      - name: Create venv and install dependencies
        run: |
          uv venv .venv
          # uv sync needs a lockfile; without one we resolve from pyproject.
          if [ -f uv.lock ]; then
            uv sync --frozen --extra dev
          else
            uv pip install --python .venv/bin/python -e ".[dev]"
          fi

      - name: ruff
        run: uv run --python .venv/bin/python ruff check .

      - name: black --check
        run: uv run --python .venv/bin/python black --check .

      - name: mypy
        run: uv run --python .venv/bin/python mypy app workers

      - name: import-linter
        run: uv run --python .venv/bin/python lint-imports

      - name: pytest unit
        run: uv run --python .venv/bin/python pytest tests/unit -m "not integration"

  backend-integration:
    # Split out from `backend` so the slow + flaky integration suite
    # doesn't block the workflow's overall conclusion. The suite has
    # 24 weather tests failing under test pollution (see commit log
    # for context) — visible-but-non-blocking until the test-infra
    # cleanup PR lands. `continue-on-error: true` lets the workflow
    # conclude as success even when this job's red, which lets
    # `argocd-sync.yml`'s workflow_run trigger fire on every green
    # main merge.
    name: backend-integration
    # 35, not 20. The suite's median is 13-16 min and the old cap killed runs
    # at exactly 20m16s with every test passing and the log ending
    # `##[error]The operation was canceled.` partway through the files. That
    # reads as a failure, costs a full re-run, and has now happened on
    # 2026-08-11 (main + #414) and 2026-08-14 (#466).
    #
    # The margin only gets worse: every feature that adds integration tests
    # moves the median toward the cap, so this was a coin flip that each merge
    # made less fair. 35 leaves real headroom while still killing a genuinely
    # hung job well short of an hour.
    #
    # Telling a timeout from a concurrency cancel: a timeout runs the FULL cap
    # (20m16s against a 20 min limit) and shows zero FAILED/ERROR lines; a
    # concurrency cancel lands at an arbitrary short time (5-9 min observed).
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    continue-on-error: true
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.2"

      - name: Set up Python
        run: uv python install 3.12

      - name: Create venv and install dependencies
        run: |
          uv venv .venv
          if [ -f uv.lock ]; then
            uv sync --frozen --extra dev
          else
            uv pip install --python .venv/bin/python -e ".[dev]"
          fi

      - name: pytest integration
        # Requires Docker daemon for testcontainers. ubuntu-24.04 ships
        # Docker; we just need to be able to talk to it.
        run: uv run --python .venv/bin/python pytest tests/integration -m integration
        env:
          # testcontainers occasionally needs the runtime to find its
          # ryuk reaper image; keep defaults.
          TESTCONTAINERS_RYUK_DISABLED: "false"

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Enable corepack and pin pnpm
        # corepack ships with Node 22 but is opt-in. The pnpm version comes
        # from frontend/package.json's `engines.pnpm` field via packageManager.
        run: corepack enable

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # NOTE: prettier formatting is enforced by the `pre-commit` job's
      # prettier hook. The local devDep prettier (package.json) is a newer
      # 3.x than the pre-commit hook pins and formats a few files differently,
      # so a second `format:check` here fought the hook. Single prettier gate
      # (pre-commit) until the two versions are aligned. TODO(prettier-align).

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  tile-server:
    name: tile-server
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tile-server
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Pinned to the versions the image's base carries (see Dockerfile),
      # so the cutline is tested against the rio-tiler that renders it.
      # boto3 is not installed here: the tests stand in for the boundary
      # read, and the module imports boto3 only when it reaches storage.
      - name: Install
        run: pip install "titiler.core==0.21.1" "rio-tiler==7.4.0" "shapely==2.0.6" pytest==8.3.4

      - name: Test
        run: python -m pytest tests -q

  helm:
    name: helm
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Add chart repos for dependencies
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update

      - name: helm dependency build (charts with dependencies)
        run: |
          for chart in infra/helm/keycloak; do
            if [ -f "${chart}/Chart.yaml" ] && grep -q '^dependencies:' "${chart}/Chart.yaml"; then
              echo "::group::dependency build ${chart}"
              helm dependency build "${chart}"
              echo "::endgroup::"
            fi
          done

      - name: helm lint
        run: |
          for chart in infra/helm/*/; do
            echo "::group::lint ${chart}"
            helm lint "${chart}"
            echo "::endgroup::"
          done

      - name: helm template (smoke render)
        run: |
          for chart in infra/helm/*/; do
            name=$(basename "${chart}")
            echo "::group::template ${name}"
            helm template "${name}" "${chart}" >/dev/null
            echo "::endgroup::"
          done

  containers:
    name: containers
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: backend
            dockerfile: backend/Dockerfile
            # Backend is multi-arch capable once build-essential is in
            # the builder stage (no arm64 wheel for timezonefinder).
            platforms: linux/amd64,linux/arm64
          - name: workers
            # Workers and the API ship from the same image â€” Celery picks
            # the entrypoint via the chart's command override. We tag the
            # same content under both names so DoD #1 sees four image
            # paths in GHCR.
            context: backend
            dockerfile: backend/Dockerfile
            platforms: linux/amd64,linux/arm64
          - name: tile-server
            context: tile-server
            dockerfile: tile-server/Dockerfile
            # BH-4: upstream `ghcr.io/developmentseed/titiler:0.21.1`
            # ships linux/amd64 only — no arm64 variant in the manifest.
            # Pin tile-server to amd64 until titiler upstream goes
            # multi-arch (tracked in titiler issue list); the chart
            # already keeps tile-server pods on amd64 nodes via
            # nodeSelector, so this matches the current cluster shape.
            platforms: linux/amd64
          - name: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
            platforms: linux/amd64,linux/arm64
          - name: keycloak
            # Tiny overlay on bitnamilegacy/keycloak that bakes the
            # `agripulse` login theme (see
            # infra/helm/keycloak/Dockerfile.theme). Context is the
            # chart dir so the COPY can see `themes/agripulse`.
            # amd64-only: bitnamilegacy keycloak images ship amd64
            # only, and the chart pins the pod to amd64 nodes via
            # nodeSelector anyway.
            context: infra/helm/keycloak
            dockerfile: infra/helm/keycloak/Dockerfile.theme
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@v6

      # BH-4: multi-arch builds (linux/amd64 + linux/arm64) so api +
      # workers + tile-server + frontend can land on Karpenter arm64
      # nodes without the `kubernetes.io/arch: amd64` nodeSelector
      # stopgap added in project_aws_resume_2026_05_16_pm.
      # QEMU is used for cross-arch emulation; arm64 builds run slower
      # but the gha cache (mode=max, scoped per image) keeps subsequent
      # PRs cheap.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/agripulse/${{ matrix.name }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # BH-4: per-matrix-entry platforms so tile-server can stay
          # amd64-only (titiler upstream isn't multi-arch yet) while the
          # backend / frontend builds emit linux/amd64 + linux/arm64
          # manifest lists. Catching the three chained build bugs from
          # project_aws_resume_2026_05_16_late (uv sync --active,
          # workers/ hatch packaging, celery `:app`) was the original
          # driver.
          platforms: ${{ matrix.platforms }}
          # Push only on merge to main; PR runs build-only to keep
          # turn-around fast and avoid polluting GHCR with PR images.
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Provenance / SBOM attestations on push so we can verify
          # image origin from cosign + a registry-native SBOM is
          # available for vulnerability scanners.
          provenance: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          sbom: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          # GHA cache scoped per image so frontend layers don't bust the
          # backend cache (or vice versa). `mode=max` cache-to writes
          # all intermediate layers, which matters for QEMU-emulated
          # builds where the slowest layer (uv sync arm64) is also the
          # most cacheable.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
