# Hetzner (single-node k3s) environment overrides for the agripulse-services
# ApplicationSet. Forked from overlays/dev/values.yaml with every AWS-IRSA
# binding stripped — on Hetzner there is no IRSA; cloud creds (Cloudflare R2,
# Cloudflare DNS) are supplied as plain Kubernetes Secrets.
#
# STATUS: scaffold. Lines marked `# TODO(hetzner-live)` need the real cluster
# to validate (chart rendering, CNPG R2 backup, cert issuance) and the actual
# secret values. To wire Hetzner into deployment, add `env: hetzner` to the
# generator list in infra/argocd/appsets/services.yaml.
global:
  env: hetzner
  # Prod domain — no `dev.` prefix. Each service Ingress renders
  # `${ingress.hostPrefix}.${global.envHost}`.
  envHost: agripulse.cloud
  # Pin to the SHAs actually running on the live cluster (hand-written
  # promotion — NOT auto-bumped like dev).
  # 3683f19 = identity unification U-1..U-4 (PRs #264 #267 #268): Users→"Team"
  #   label, worker role vocab canonicalised + worker↔member link, farm_manager
  #   derived from FarmManager scope, block agronomist repointed to membership
  #   + UI picker. Tenant migrations 0043-0046 run on PreSync (public head stays
  #   0036). api + workers + frontend promoted together off the same SHA.
  # tile-server unchanged (no backend delta) stays 9d140cc.
  # b5a5d0f = #269 backend fixes: auto-grid clips to farm boundary + farm_scopes
  #   synced to Keycloak so farm-scoped roles work (SMK-RBAC-BUG-01). Backend-only
  #   → api + workers bumped; frontend stayed 3683f19 (no FE delta).
  # be230ac = #270: farm-scoped list access (SMK-RBAC-GAP-02 — switcher + recs/
  #   alerts/signals), Settings "Rules & thresholds" nav removed, board season
  #   picker + no-matching-plan message. Backend + frontend → all three bumped.
  # 75023fb = #271 weather indices first-class (PR-W1..W5): public catalog +
  #   tenant weather_index_daily/baselines + projection + weekly climatology
  #   sweep + farm-scoped REST timeseries/summary + Insights weather strip.
  #   Public migration 0037 + tenant 0047 run on PreSync. Backend + frontend →
  #   all three bumped. tile-server unchanged stays 9d140cc.
  # 21635de = #272 + #273 (tip of main, both squash-merged together):
  #   #272 auto-grid driven by per-block max area (not cell size) — backend
  #     farms module + mapnext FE + i18n.
  #   #273 scientific Egyptian plan templates + extended activity vocabulary —
  #     seeds date-palm phenology + potato/date varieties + mango/potato/date
  #     cultivar templates. Public migrations 0038-0042 (seed data) + tenant
  #     0048 (activity_type extended vocab) run on PreSync. Backend + frontend.
  #   All three bumped; tile-server unchanged stays 9d140cc.
  # 3424d65 = #274 weather indices first-class P1 finale (PR-W6/W7):
  #   weather_index condition source (trees consume the 7 indices + z-score) +
  #   Weather+GDD report anomaly columns/strip + FE authoring field. No
  #   migrations (reads weather_index_daily/baselines from #271). Backend + FE
  #   → api + workers + frontend bumped; tile-server unchanged stays 9d140cc.
  # 7c4129f = #276 + #277 (tip of main):
  #   #276 fix(farms): restore weather+imagery subscriptions on block/farm
  #     reactivation (asymmetric-cascade bug). Tenant migration 0049 adds
  #     deactivated_by_cascade — runs on PreSync. Backend.
  #   #277 feat(insights): clickable Land-units→/labs/map + Upcoming→/board
  #     tiles, trend-chart index description + From→To date filter. Frontend.
  #   Also bumps WEATHER_FORECAST_HOURS 120→168 (below) so the Insights weather
  #   chart's 7-day request isn't clipped to 5. Backend + FE → api + workers +
  #   frontend bumped; tile-server unchanged stays 9d140cc.
  # c8174e2 = #278 weather-driven disease/pest risk (PR-R1/R2): per-block risk
  #   models (powdery mildew/anthracnose/fruit fly) + daily compute Beat sweep +
  #   /weather-risk REST + weather_risk.read cap. Tenant migration 0050
  #   (weather_risk_daily) runs on PreSync. Backend-only → api + workers bumped;
  #   frontend stays 7c4129f, tile-server stays 9d140cc.
  # b7541c1 = #280 Arabic i18n hardening + insights tiles/trend range:
  #   localize the Insights cards, Farm Console grid-cell popup, and board /
  #   alerts dates + enum values (severity / unit_type / activity type) via
  #   useDateLocale, plus clickable KPI tiles and trend index help + date range.
  #   No migrations. Frontend-only → only frontend bumped; api + workers stay
  #   c8174e2, tile-server stays 9d140cc.
  # 50683b5 = #281 weather-risk conditions (PR-R3): `weather_risk` decision-tree
  #   condition source + 3 seed mango disease/pest trees (powdery mildew /
  #   anthracnose / fruit fly) + the FE authoring field. No migrations (reads
  #   weather_risk_daily from #278; trees auto-published by sync_from_disk).
  #   Backend + FE → api + workers + frontend bumped; tile-server stays 9d140cc.
  # 5efbf4c = #282 weather-risk map drawer + Insights widget (PR-R4a): per-block
  #   disease/pest risk in the /labs/map DetailPanel + an Insights active-risks
  #   widget + weatherRisk API client/i18n/cap. No migrations, frontend-only →
  #   only frontend bumped; api + workers stay 50683b5, tile-server 9d140cc.
  # 98fb143 = #283 weather-risk map overlay (PR-R4b): a "Risk" /labs/map toolbar
  #   toggle recolours blocks by worst disease/pest level (setPaintProperty swap
  #   on the block fill). No migrations, frontend-only → only frontend bumped;
  #   api + workers stay 50683b5, tile-server 9d140cc.
  # 3833aed = #284 disease & pest pressure report (PR-R5): 6th standard report
  #   over weather_risk_daily (peak/days-high per block-pathogen) + registry FE
  #   entry. No migrations (reads #278's table). Backend + FE → api + workers +
  #   frontend bumped; tile-server stays 9d140cc. (Completes Phase 2.)
  # d93eac7 = #287 Arabic i18n cleanup: grid-popup flag hint uses Latin digits
  #   (1.5 not ١٫٥, per ARCHITECTURE.md § 11) + drop dead src/rules/formatting.ts.
  #   Frontend-only, no migrations → only frontend bumped; api + workers stay
  #   ece5615, tile-server stays 9d140cc.
  # 7035b22 = #296 Decision Tree multi-axis targeting (crop/country/soil) +
  #   authoring improvements (PR-1..9). MIGRATIONS: public 0043 (countries
  #   catalog) + 0044 (decision_trees crop_paths/country_codes/soil_textures),
  #   tenant 0051 (farms.country_code, backfilled to 'EG'). Backend + FE → api +
  #   workers + frontend bumped; tile-server stays 9d140cc.
  # a88cd5d = #297 fix: include crop_paths/country_codes/soil_textures in the
  #   GET /v1/decision-trees catalog-list SELECT (caught in #296 live smoke).
  #   No migrations, api request-path only → only api bumped; workers stay
  #   7035b22, frontend 7035b22, tile-server 9d140cc.
  # 2b8705c = #298 per-cell decision-tree execution scope (P1 PR-C1..C3 + P2
  #   map/notification surfacing). MIGRATIONS: public 0045 (decision_trees.scope
  #   block|cell) + tenant 0052 (cell_id on recommendations/_history/alerts +
  #   split open-state idempotency). Backend (engine + events/subscribers) + FE
  #   → api + workers + frontend bumped; tile-server stays 9d140cc.
  # 874c847 = #299 seed the first scope:cell demonstrator tree
  #   (demo_cell_low_ndvi_v1). No migration; api runs sync_from_disk on startup
  #   to create+publish it, workers-beat sweep evaluates it per cell → api +
  #   workers bumped; frontend stays 2b8705c, tile-server 9d140cc.
  # 5dc113c = #300 fix: savepoint around idempotent rec/alert insert conflicts
  #   (re-evaluation no longer 500s; found in #299 cell demonstrator smoke). No
  #   migration; backend repos only → api + workers bumped; frontend 2b8705c.
  # b22151c = #302 per-cell rollup: board rail aggregates cell recs into one
  #   zone-count chip (F1); notifications digest cell-scoped recs into one
  #   "N zones flagged" notification (sweep emits a synthetic block-level event,
  #   handler suppresses per-cell). No migration; backend + FE → api + workers +
  #   frontend bumped; tile-server stays 9d140cc.
  # 6d95dd3 = #303 one-shot historical imagery+weather backfill (raw-only). New
  #   Celery tasks (imagery.backfill_scenes/backfill_farm_scenes,
  #   weather.backfill_weather + Open-Meteo archive fetch) register at worker
  #   startup; no migration. Backend only → api + workers bumped; frontend
  #   b22151c, tile-server 9d140cc.
  # 698fcc1 = #308 bulk-create blocks from uploaded AOI files. Farm Console
  #   +Add → "Upload AOI files": POST /farms/{id}/blocks:bulk reconcile
  #   (new/reuse/replace by code) + color-coded map preview. No migration;
  #   backend + FE → api + workers + frontend bumped; tile-server 9d140cc.
  # d6defe2 = #307 farm inactivate/reactivate surfaced in the Farm Console
  #   settings drawer (danger zone + cascade-preview modal + inactive-farm
  #   banner). Endpoints already existed and are unchanged; no migration.
  #   FE only → frontend bumped; api + workers stay 698fcc1, tile-server
  #   9d140cc.
  # c8391e6 = #311 map loads block boundaries in ONE request. A farm with N
  #   blocks used to cost N extra GET /blocks/{id}; at 37 blocks (bulk AOI
  #   upload) that burst exhausted the api DB pool (QueuePool 5+10) and the
  #   console failed with "Couldn't load this farm". Adds
  #   ?include_boundary=true on the blocks list + stops echoing all prod SQL
  #   (sqlalchemy.engine was pinned to INFO). No migration; backend + FE →
  #   api + workers + frontend bumped; tile-server 9d140cc.
  images:
    api:
      tag: "c8391e6"
    workers:
      tag: "c8391e6"
    frontend:
      tag: "c8391e6"
    tileServer:
      tag: "9d140cc"
# Top-level env merges into every service chart's own env map (api + workers
# consume all of these; tile-server/frontend ignore the keys they don't read).
env:
  # PlatformAdmin identity MUST equal the Keycloak realm seed user
  # (agripulse-realm.json users[0].email = dev@agripulse.local), else the JWT
  # email won't match the platform_role_assignments row the bootstrap seeds
  # and login lands in tenant-user mode instead of PlatformAdmin. Switching to
  # a real admin email is a separate change that also reseeds the realm user.
  PLATFORM_ADMIN_EMAIL: dev@agripulse.local
  PLATFORM_ADMIN_FULL_NAME: Platform Admin
  # Copernicus Data Space Ecosystem (CDSE) — the EU's FREE Sentinel Hub
  # (10k PU/month). Replaces the expired commercial trial. Same SH Process/
  # Catalog API, so only these 4 env vars + SENTINEL_HUB_CLIENT_SECRET in the
  # hand-seeded agripulse-app-secrets differ. client_id is non-secret (paired
  # with the secret). CDSE OAuth client via dataspace.copernicus.eu.
  SENTINEL_HUB_CLIENT_ID: "sh-c6548100-d4ae-48e7-ba8e-898c7c9e9499"
  SENTINEL_HUB_OAUTH_URL: "https://identity.dataspace.copernicus.eu/auth/realms/CDSE/protocol/openid-connect/token"
  SENTINEL_HUB_PROCESS_URL: "https://sh.dataspace.copernicus.eu/api/v1/process"
  SENTINEL_HUB_CATALOG_URL: "https://sh.dataspace.copernicus.eu/api/v1/catalog/1.0.0/search"
  # Keycloak split-URL (Hetzner only): the public issuer host
  # keycloak.agripulse.cloud does NOT resolve inside the cluster, so only
  # KEYCLOAK_ISSUER (must match the JWT `iss`) stays public (chart default via
  # envHost); api/workers reach Keycloak over in-cluster DNS for token + JWKS.
  KEYCLOAK_BASE_URL: http://keycloak
  KEYCLOAK_JWKS_URL: http://keycloak/realms/agripulse/protocol/openid-connect/certs
  # Object storage = Cloudflare R2 (S3-compatible): region "auto" and a single
  # bucket with no per-env suffix. Endpoint + access keys arrive via the
  # agripulse-app-secrets Secret (envFrom), not here.
  S3_REGION: auto
  S3_BUCKET_UPLOADS: agripulse-imagery
  AWS_DEFAULT_REGION: auto
  # No Tempo on Hetzner — disable OTEL so the SDK doesn't retry-storm a
  # non-existent OTLP collector.
  OTEL_SDK_DISABLED: "true"
  # Forecast horizon stored per fetch. Default is 120h (5d); the Insights
  # weather chart requests a 7-day horizon, so bump to 168h (7d) — within
  # Open-Meteo's free-tier forecast range — so "next week" isn't clipped.
  WEATHER_FORECAST_HOURS: "168"
# Plain Secrets loaded via envFrom (ESO is off; these are hand-seeded). The
# single shared overlay applies to every service chart, so api/workers/tile
# all load both — harmless (same R2 account creds; unused keys are ignored).
# Per-chart scoping would need per-chart value files (a #5 refinement).
extraEnvFromSecrets:
  - agripulse-app-secrets
  - agripulse-r2-gdal
# No External Secrets Operator on Hetzner — secrets seeded directly.
# `externalSecret` (api/workers) gates the ExternalSecret CR; `externalSecrets`
# (shared) gates the ClusterSecretStore. Both off.
externalSecret:
  enabled: false
externalSecrets:
  enabled: false # shared chart ClusterSecretStore
  # keycloak wrapper-chart ExternalSecrets (admin/db/promote) — ESO is off on
  # Hetzner, so these CRs would fail to apply (no external-secrets.io CRD).
  admin:
    enabled: false
  db:
    enabled: false
  promote:
    enabled: false
# No prometheus-operator on Hetzner → ServiceMonitor CRD absent; rendering one
# would fail to apply. (CNPG's PodMonitor is gated separately below.)
serviceMonitor:
  enabled: false
labels:
  partOf: agripulse
# Single node, no HA.
replicaCount: 1
ingress:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
keycloak:
  ingress:
    hostname: keycloak.agripulse.cloud
    hostnameStrict: true
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
  image:
    tag: "9d140cc"
  # No prometheus-operator on Hetzner → ServiceMonitor CRD absent.
  metrics:
    serviceMonitor:
      enabled: false
  # Live keycloak has no NetworkPolicy; the bitnami default would create one
  # that restricts traffic. Keep it off (single node, ingress-nginx fronts it).
  networkPolicy:
    enabled: false
# Promote-bootstrap PostSync hook reaches Keycloak in-cluster. On Hetzner the
# bitnami Service is `keycloak` (release name), not the chart default
# `keycloak-dev` (the old AWS App name) — point the hook at the right host.
promoteBootstrap:
  # Re-enabled with failOnError:false (the FOLLOW-UP the disabled note called
  # for). The original concern — a failed PostSync hook blocking the keycloak
  # sync when Keycloak is briefly unreachable — is now addressed: failOnError
  # false turns any step failure (or KC-unreachable) into a logged warning +
  # clean exit 0, so the sync is never blocked. The scripts are idempotent.
  #
  # Why it's needed: without it the agripulse-tenancy service-account client
  # keeps the realm-import PLACEHOLDER secret, so the api can't get an admin
  # token (401 unauthorized_client) and tenant provisioning fails. promote-kc-
  # tenancy.py sets the client secret from the hand-seeded TENANCY_CLIENT_SECRET
  # and is self-contained (httpx only), so it works even while the pinned api
  # image predates the promote-kc-admin.py dev_bootstrap helpers (that step just
  # logs a non-fatal warning until the image is promoted).
  enabled: true
  failOnError: false
  keycloakBaseUrl: http://keycloak
# external-dns on Cloudflare instead of Route53. No IRSA — the chart reads a
# Cloudflare API token from a Secret.
# TODO(hetzner-live): set provider=cloudflare + reference the CF token secret;
# confirm the external-dns chart values support it (or drop external-dns and
# manage the handful of records by hand in Cloudflare).
externalDns:
  serviceAccount:
    annotations: {}
# No cluster autoscaler on a fixed VM.
karpenter:
  enabled: false
# cert-manager: no IRSA. Single-node k3s with ports 80/443 public on the node,
# so HTTP-01 through ingress-nginx is the simplest issuer (no Cloudflare DNS
# token needed). This overrides the shared chart's AWS default (DNS-01 via
# Route53), matching the live cert-manager install + the two ClusterIssuers
# created this session. The ingress.annotations.cert-manager.io/cluster-issuer
# below + each service chart's rendered spec.tls block let ingress-shim
# auto-issue, replacing the manual /root/enable-tls.sh.
certManager:
  enabled: true
  acme:
    # Matches the live ACME account registration (avoids re-registering on the
    # GitOps cutover). LE only uses this for expiry notices.
    email: mohamed75soliman@gmail.com
    solvers:
      - http01:
          ingress:
            class: nginx
certManagerController:
  serviceAccount:
    annotations: {}
# api: no IRSA. R2 (S3-compatible) creds come from a Secret as env vars.
# TODO(hetzner-live): drop the IRSA SA annotation (done) and confirm the api
# chart reads R2 endpoint/key/secret from env rather than instance role.
serviceAccount:
  create: true
  annotations: {}
postgresCluster:
  instances: 1
  # The keycloak DB already exists on the adopted cluster, and this PostSync
  # hook (CREATE DATABASE IF NOT EXISTS) would re-run on every ArgoCD reconcile
  # — same hook-churn class as the promote hook. Off for adoption; re-enable for
  # from-scratch reproducibility.
  keycloakDbBootstrap:
    enabled: false
  # k3s local-path provisioner (repointed at the detachable volume /mnt/pgdata
  # by 02-node-bootstrap.sh) — overrides the chart's AWS gp3 default.
  storage:
    size: 100Gi
    storageClass: local-path
  walStorage:
    size: 30Gi
    storageClass: local-path
  # Match the live cluster (chart default 4Gi/8Gi) so adoption doesn't restart
  # the single PG instance (= brief full-app downtime). Tune later in a window.
  resources:
    requests:
      cpu: "1"
      memory: 4Gi
    limits:
      cpu: "2"
      memory: 8Gi
  # No IRSA on Hetzner.
  serviceAccountAnnotations: {}
  # No prometheus-operator → no PodMonitor CRD. CNPG tolerates the missing CRD
  # (warns) but gate it off for a clean apply.
  monitoring:
    enablePodMonitor: false
  # Barman backups → Cloudflare R2 via static S3 creds from the agripulse-r2
  # Secret (no IRSA). Single bucket, no per-env suffix. endpointURL carries
  # only the CF account id (an identifier, not a credential — the R2 access
  # keys live in the agripulse-r2 Secret), so it is safe to commit and keeps
  # the CNPG backup fully GitOps-managed.
  backup:
    barmanObjectStore:
      destinationPath: "s3://agripulse-pg-backup/pg"
      endpointURL: "https://83c91caacdfd03a1e6cb07e4fdf882a4.r2.cloudflarestorage.com"
      s3Credentials:
        inheritFromIAMRole: false
        secretName: agripulse-r2
        accessKeyIdKey: ACCESS_KEY_ID
        secretAccessKeyKey: SECRET_ACCESS_KEY
migrations:
  enabled: true
# Keep each chart's own resources (api 512Mi, tile-server 2Gi for GDAL, etc.) —
# the cx43 node (8 vCPU / 16 GiB) fits them, and the live cluster runs on these.
# A blanket override here would shrink tile-server to 256Mi and OOM GDAL.
# Single light-worker replica (matches live; chart default is 2).
workloads:
  light:
    replicaCount: 1
