  # ccb8643 = #335 the "Compute indices" run sat on Queued for hours with an
  #   IDLE worker and empty queues -- imagery.backfill_farm_indices had died 9s
  #   after dispatch. It bound its window as ISO strings into
  #   CAST(:from_iso AS timestamptz), so asyncpg rejected the str on every
