  #   before 14:00 UTC becomes due at once, so expect one catch-up round of
  #   discovery across all tenants, then one poll a day.
  #   BACKEND ONLY. Frontend stays 0cba71c, tile-server stays 9d140cc.
  #   Images CONFIRMED by pulling both on the node: api @ 19880147624db,
  #   workers @ 5b4a94a16f2d5.
  # 992cfb5 = #537, Team & roles offers the roles the platform actually has.
  #   The dropdown was a four-element literal in UsersConfigPage.tsx while
  #   Roles & permissions read ten roles from /admin/rbac/matrix. Nothing
  #   compared the two, so four of the eight roles a tenant admin may grant
  #   could not be granted, and the screen showed no sign of it.
  #   A tenant-wide Viewer granted NOTHING. The tenant_role claim is parsed
  #   with _safe_enum(..., TenantRole) and TenantRole has no Viewer member,
  #   so the value was dropped and the member had no capabilities at all.
  #   Viewer is a FarmRole; it now goes through farm_scopes, where it
  #   resolves. Five such rows exist on prod, all demo accounts in
  #   agrosina-demo-2, each already holding a farm scope — so nobody's
  #   access changes and no data migration is needed.
  #   Also: no role could be changed after invite (role.assign_tenant was
  #   marked active and held by TenantOwner/TenantAdmin but no route ever
  #   enforced it), and the role on the invite body was an unvalidated str,
  #   so a request naming PlatformAdmin was stopped only by the
  #   tenant_role_assignments CHECK and surfaced as a 500.
  #   NEW ROUTE: PUT /v1/users/{user_id}/role. GET /v1/users grows
  #   farm_roles.
  #   API + FRONTEND MOVE TOGETHER, and they must. The new dropdown posts a
  #   (role, farm_ids) pair and calls the new route; against 127406f the
  #   route is a 404 and any farm-tier role is rejected. The old frontend
  #   against the new api still works — `tenant_role` stays accepted as an
  #   alias for `role` — so the frontend is the half that cannot lag.
  #   Workers move because they share the api image.
  #   No migrations. tile-server unchanged stays 9d140cc.
  #   Images CONFIRMED by pulling both on the node: api @ 0b21d9f6a92e8,
  #   frontend @ bb910367d1fd5.
  # f04a739 = #538, the platform alerts list and the red bar. Adds
  #   public.platform_alerts (public migration 0069, runs on PreSync) and a
  #   Beat sweep, platform_alerts.sweep, every 10 minutes.
  #   WHY IT EXISTS: the existing streak watcher only sees failures that were
  #   recorded as failures. Four problems were running here on 2026-08-21 with
  #   nothing reported anywhere - indices_calc_runs empty in all 3 tenants
  #   since the table shipped, irrigation.water_balance_for_tenant raising on
  #   every run, an OOM kill, and 9 imagery jobs stuck in `running` (oldest
  #   528 hours). This ships the detectors plus fixes for the two SQL bugs.
  #   API + WORKERS + FRONTEND MOVE TOGETHER. The workers carry the sweep and
  #   the Celery task_failure hook, the api serves /v1/admin/alerts, and the
  #   frontend adds /platform/alerts plus the bar in AppShell. An old frontend
  #   against the new api just lacks the page; a new frontend against the old
  #   api gets a 404 on every summary poll, so the api cannot lag.
  #   tile-server unchanged stays 9d140cc.
  #   Images CONFIRMED by pulling all three on the node: api @ f01b4a954685b,
  #   workers @ e18e61978df27, frontend @ 6db993dce2adf.
  # 676746a = #539, index colour stops at the farm border. The tile server
  #   cuts every rendered image to the farm boundary, so the colour a grower
  #   sees ends where the field ends. The stored raster is cut on its own
  #   10 m pixel grid, which leaves up to 5 m of colour outside a straight
  #   border and 15 m on the 30 m thermal product; this cuts again on the
  #   grid of the image returned, which is screen pixels.
  #   ALL FOUR MOVE TOGETHER. tile-server carries the `cutline` algorithm and
  #   its own application module (MODULE_NAME now points at agripulse_tiles
  #   .main); the frontend is what asks for the cut; api + workers write the
  #   boundary object the tile server reads. Each half is inert without the
  #   others and none of them breaks the old behaviour: a farm with no
  #   boundary object published renders exactly as it does today.
  #   No migrations.
  #   AFTER THE ROLL: run imagery.publish_farm_boundaries once, or farms
  #   whose scenes were computed before this stay uncut until their next
  #   pass.
  #   Images CONFIRMED by pulling all three on the node: api @ 454567dea7c0d,
  #   frontend @ 09832222b93f5, tile-server @ 82ec67bfa5abb.
  # 03f2a0d = #541, the Platform alerts page rendered blank.
  #   /platform/alerts handed <DataTable> the whole `{items, total, limit,
  #   offset}` response instead of the rows. DataTable calls .map() on what it
  #   gets, so the render threw `TypeError: data.map is not a function`. There
  #   is no React error boundary anywhere in frontend/src, so the throw
  #   unmounted the whole app and the page body was empty. The red bar at the
  #   top of every page links here, so the one screen that explains the bar
  #   showed nothing. A `as unknown as Parameters<typeof queryState<...>>[0]`
  #   cast is why tsc accepted it.
  #   FRONTEND ONLY. `git diff --name-only 676746a 03f2a0d` touches two files
  #   under frontend/src and nothing else, so api, workers and tile-server
  #   stay on 676746a rather than restart for no delta.
  #   No migrations.
  #   Image CONFIRMED by pulling on the node: frontend @ c67c9a008338f.
  images:
    api:
      tag: "676746a"
    workers:
      tag: "676746a"
    frontend:
      # 822dea3 = #528, every index tile in the Block Dock gets a reading.
      #   Ten of the thirteen tiles rendered disabled and greyed, showing an
      #   em dash and the words "Grid only". The tooltip claimed there was no
      #   block-level trend for them. Two endpoints had been confused:
      #   /farms/{id}/blocks/summary publishes three fixed columns for every
      #   block at once and is polled every 60s, while
      #   /blocks/{id}/indices/{code}/timeseries takes any index_code and
      #   reads block_index_daily with no allowed-list. Confirmed on prod
      #   before shipping: block_index_daily holds all thirteen codes for the
      #   same blocks, 1435 rows each.
      #   Also fixes the delta colour, which assumed every index climbs
      #   toward health — a +6 °C week on LST rendered green, as did rising
      #   MSI and rising NDWI.
      #   FRONTEND ONLY. The backend change in the PR is a comment, so api +
      #   workers stay 4bda4c8. No migrations.
      #   Image CONFIRMED by pulling it on the node: frontend @ 822dea3,
      #   sha256 a1980f9058659.
      # 5e84dd6 = #515, the thermal indices reach the decision-tree condition
      #   builder. `lst`/`cwsi`/`smi` were computed and stored per block —
      #   796 `lst` rows in prod — but the builder's index picker mirrored
      #   STANDARD_INDEX_CODES alone, so no rule could branch on canopy
      #   temperature or crop water stress. The `indices` source now offers
      #   both products as two <optgroup>s; the `grid` source stays optical
      #   because grid cells are cut per product and only the optical one has
      #   a grid config.
      #   FRONTEND ONLY — nothing on the backend needed changing (the
      #   condition parser takes any index_code and the loader has no product
      #   filter), so api + workers stay 6207ee3. No migrations.
      #   Image CONFIRMED by pulling it on the node: frontend @ 5e84dd6.
      # ceaa572 = #512, the last block-vs-farm wording from #506. On a
      #   whole-farm scene the pixel-cap notice read "the BLOCK is larger
      #   than the map cap" — a whole-farm acquisition is clipped to the
      #   FARM boundary and has no block. The pixel-grid payload already
      #   carried `scope`; the notice was not reading it.
      #   FRONTEND ONLY; api + workers stay 86faf0b. No migrations.
      #   Image CONFIRMED by pulling it on the node: frontend @ ceaa572.
      #
      # 2f1d766 = #531, the date bar says what cloud cost the farm. Moves with
      #   the api — see the note above the `images` key.
      #
      # 0cba71c = #533, one queue and one of each console. Moves with the api
      #   and the workers — see the note above the `images` key.
      #
      # 992cfb5 = #537, Team & roles offers the roles the platform actually
      #   has. MUST move with the api: the dropdown calls a route that only
      #   the new api serves. See the note above the `images` key.
      #
      # f04a739 = #538, the platform alerts list and the red bar. Moves with
      #   the api and the workers - see the note above the `images` key.
      tag: "03f2a0d"
    tileServer:
      tag: "676746a"
# Top-level env merges into every service chart's own env map (api + workers
# consume all of these; tile-server/frontend ignore the keys they don't read).
env:
  # PlatformAdmin identity MUST equal the Keycloak realm seed user
  # (agripulse-realm.json users[0].email = dev@agripulse.local), else the JWT
  # email won't match the platform_role_assignments row the bootstrap seeds
  # and login lands in tenant-user mode instead of PlatformAdmin. Switching to
  # a real admin email is a separate change that also reseeds the realm user.
  PLATFORM_ADMIN_EMAIL: dev@agripulse.local
  PLATFORM_ADMIN_FULL_NAME: Platform Admin
  # Copernicus Data Space Ecosystem (CDSE) — the EU's FREE Sentinel Hub
  # (10k PU/month). Replaces the expired commercial trial. Same SH Process/
  # Catalog API, so only these 4 env vars + SENTINEL_HUB_CLIENT_SECRET in the
  # hand-seeded agripulse-app-secrets differ. client_id is non-secret (paired
  # with the secret). CDSE OAuth client via dataspace.copernicus.eu.
  SENTINEL_HUB_CLIENT_ID: "sh-c6548100-d4ae-48e7-ba8e-898c7c9e9499"
  SENTINEL_HUB_OAUTH_URL: "https://identity.dataspace.copernicus.eu/auth/realms/CDSE/protocol/openid-connect/token"
  SENTINEL_HUB_PROCESS_URL: "https://sh.dataspace.copernicus.eu/api/v1/process"
  SENTINEL_HUB_CATALOG_URL: "https://sh.dataspace.copernicus.eu/api/v1/catalog/1.0.0/search"
  # Keycloak split-URL (Hetzner only): the public issuer host
  # keycloak.agripulse.cloud does NOT resolve inside the cluster, so only
  # KEYCLOAK_ISSUER (must match the JWT `iss`) stays public (chart default via
  # envHost); api/workers reach Keycloak over in-cluster DNS for token + JWKS.
  KEYCLOAK_BASE_URL: http://keycloak
  KEYCLOAK_JWKS_URL: http://keycloak/realms/agripulse/protocol/openid-connect/certs
  # Object storage = Cloudflare R2 (S3-compatible): region "auto" and a single
  # bucket with no per-env suffix. Endpoint + access keys arrive via the
  # agripulse-app-secrets Secret (envFrom), not here.
  S3_REGION: auto
  S3_BUCKET_UPLOADS: agripulse-imagery
  AWS_DEFAULT_REGION: auto
  # No Tempo on Hetzner — disable OTEL so the SDK doesn't retry-storm a
  # non-existent OTLP collector.
  OTEL_SDK_DISABLED: "true"
  # Forecast horizon stored per fetch. Default is 120h (5d); the Insights
  # weather chart requests a 7-day horizon, so bump to 168h (7d) — within
  # Open-Meteo's free-tier forecast range — so "next week" isn't clipped.
  WEATHER_FORECAST_HOURS: "168"
  # Push (AgriPulse Scout). Left unset, `fcm_enabled` defaults to false and
  # every send records `skipped` rather than `failed` — correct behaviour and
  # the quietest possible failure, which is how a pilot runs for a week
  # believing push works. The project id is not a secret; the service-account
  # key arrives as FCM_SERVICE_ACCOUNT_JSON in agripulse-app-secrets.
  FCM_ENABLED: "true"
  FCM_PROJECT_ID: "agripulse-scout"
  # Notification sink for the org simulation harness. The harness runs a
  # throwaway tenant on PROD, beside real customers, so suppression is keyed on
  # the tenant slug rather than a process-wide switch — anything else would
  # silence real tenants' mail. Tenants whose slug starts with this prefix get
  # every email/push/webhook recorded as `skipped` with a reason and nothing
  # leaves the system; every other tenant is untouched.
  #
  # The code (app/modules/notifications/sink.py) has been live since f3b978a
  # but ships inert — the default is "" — so until this key exists a spine run
  # mails whatever addresses the cloned seed carries. MUST equal
  # SIM_TENANT_PREFIX in scripts/sim/.sim.env; Act 3 asserts on the dispatch
  # rows to prove suppression actually happened.
  NOTIFICATION_SINK_TENANT_PREFIX: "sim-"
# Plain Secrets loaded via envFrom (ESO is off; these are hand-seeded). The
# single shared overlay applies to every service chart, so api/workers/tile
# all load both — harmless (same R2 account creds; unused keys are ignored).
# Per-chart scoping would need per-chart value files (a #5 refinement).
extraEnvFromSecrets:
  - agripulse-app-secrets
  - agripulse-r2-gdal
# No External Secrets Operator on Hetzner — secrets seeded directly.
# `externalSecret` (api/workers) gates the ExternalSecret CR; `externalSecrets`
# (shared) gates the ClusterSecretStore. Both off.
externalSecret:
  enabled: false
externalSecrets:
  enabled: false # shared chart ClusterSecretStore
  # keycloak wrapper-chart ExternalSecrets (admin/db/promote) — ESO is off on
  # Hetzner, so these CRs would fail to apply (no external-secrets.io CRD).
  admin:
    enabled: false
  db:
    enabled: false
  promote:
    enabled: false
# No prometheus-operator on Hetzner → ServiceMonitor CRD absent; rendering one
# would fail to apply. (CNPG's PodMonitor is gated separately below.)
serviceMonitor:
  enabled: false
labels:
  partOf: agripulse
# Single node, no HA.
replicaCount: 1
ingress:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
keycloak:
  ingress:
    hostname: keycloak.agripulse.cloud
    hostnameStrict: true
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
  image:
    tag: "9d140cc"
  # No prometheus-operator on Hetzner → ServiceMonitor CRD absent.
  metrics:
    serviceMonitor:
      enabled: false
  # Live keycloak has no NetworkPolicy; the bitnami default would create one
  # that restricts traffic. Keep it off (single node, ingress-nginx fronts it).
  networkPolicy:
    enabled: false
# Promote-bootstrap PostSync hook reaches Keycloak in-cluster. On Hetzner the
# bitnami Service is `keycloak` (release name), not the chart default
# `keycloak-dev` (the old AWS App name) — point the hook at the right host.
promoteBootstrap:
  # Re-enabled with failOnError:false (the FOLLOW-UP the disabled note called
  # for). The original concern — a failed PostSync hook blocking the keycloak
  # sync when Keycloak is briefly unreachable — is now addressed: failOnError
  # false turns any step failure (or KC-unreachable) into a logged warning +
  # clean exit 0, so the sync is never blocked. The scripts are idempotent.
  #
  # Why it's needed: without it the agripulse-tenancy service-account client
  # keeps the realm-import PLACEHOLDER secret, so the api can't get an admin
  # token (401 unauthorized_client) and tenant provisioning fails. promote-kc-
  # tenancy.py sets the client secret from the hand-seeded TENANCY_CLIENT_SECRET
  # and is self-contained (httpx only), so it works even while the pinned api
  # image predates the promote-kc-admin.py dev_bootstrap helpers (that step just
  # logs a non-fatal warning until the image is promoted).
  enabled: true
  failOnError: false
  keycloakBaseUrl: http://keycloak
# external-dns on Cloudflare instead of Route53. No IRSA — the chart reads a
# Cloudflare API token from a Secret.
# TODO(hetzner-live): set provider=cloudflare + reference the CF token secret;
# confirm the external-dns chart values support it (or drop external-dns and
# manage the handful of records by hand in Cloudflare).
externalDns:
  serviceAccount:
    annotations: {}
# No cluster autoscaler on a fixed VM.
karpenter:
  enabled: false
# cert-manager: no IRSA. Single-node k3s with ports 80/443 public on the node,
# so HTTP-01 through ingress-nginx is the simplest issuer (no Cloudflare DNS
# token needed). This overrides the shared chart's AWS default (DNS-01 via
# Route53), matching the live cert-manager install + the two ClusterIssuers
# created this session. The ingress.annotations.cert-manager.io/cluster-issuer
# below + each service chart's rendered spec.tls block let ingress-shim
# auto-issue, replacing the manual /root/enable-tls.sh.
certManager:
  enabled: true
  acme:
    # Matches the live ACME account registration (avoids re-registering on the
    # GitOps cutover). LE only uses this for expiry notices.
    email: mohamed75soliman@gmail.com
    solvers:
      - http01:
          ingress:
            class: nginx
certManagerController:
  serviceAccount:
    annotations: {}
# api: no IRSA. R2 (S3-compatible) creds come from a Secret as env vars.
# TODO(hetzner-live): drop the IRSA SA annotation (done) and confirm the api
# chart reads R2 endpoint/key/secret from env rather than instance role.
serviceAccount:
  create: true
  annotations: {}
postgresCluster:
  instances: 1
  # The keycloak DB already exists on the adopted cluster, and this PostSync
  # hook (CREATE DATABASE IF NOT EXISTS) would re-run on every ArgoCD reconcile
  # — same hook-churn class as the promote hook. Off for adoption; re-enable for
  # from-scratch reproducibility.
  keycloakDbBootstrap:
    enabled: false
  # k3s local-path provisioner (repointed at the detachable volume /mnt/pgdata
  # by 02-node-bootstrap.sh) — overrides the chart's AWS gp3 default.
  storage:
    size: 100Gi
    storageClass: local-path
  walStorage:
    size: 30Gi
    storageClass: local-path
  # Match the live cluster (chart default 4Gi/8Gi) so adoption doesn't restart
  # the single PG instance (= brief full-app downtime). Tune later in a window.
  resources:
    requests:
      cpu: "1"
      memory: 4Gi
    limits:
      cpu: "2"
      memory: 8Gi
  # No IRSA on Hetzner.
  serviceAccountAnnotations: {}
  # No prometheus-operator → no PodMonitor CRD. CNPG tolerates the missing CRD
  # (warns) but gate it off for a clean apply.
  monitoring:
    enablePodMonitor: false
  # Barman backups → Cloudflare R2 via static S3 creds from the agripulse-r2
  # Secret (no IRSA). Single bucket, no per-env suffix. endpointURL carries
  # only the CF account id (an identifier, not a credential — the R2 access
  # keys live in the agripulse-r2 Secret), so it is safe to commit and keeps
  # the CNPG backup fully GitOps-managed.
  backup:
    barmanObjectStore:
      destinationPath: "s3://agripulse-pg-backup/pg"
      endpointURL: "https://83c91caacdfd03a1e6cb07e4fdf882a4.r2.cloudflarestorage.com"
      s3Credentials:
        inheritFromIAMRole: false
        secretName: agripulse-r2
        accessKeyIdKey: ACCESS_KEY_ID
        secretAccessKeyKey: SECRET_ACCESS_KEY
migrations:
  enabled: true
# Keep each chart's own resources (api 512Mi, tile-server 2Gi for GDAL, etc.) —
# the cx43 node (8 vCPU / 16 GiB) fits them, and the live cluster runs on these.
# A blanket override here would shrink tile-server to 256Mi and OOM GDAL.
# Single light-worker replica (matches live; chart default is 2).
workloads:
  light:
    replicaCount: 1
