  #   Once 0071 has run, 7889d95 CANNOT serve: it selects resources.farm_id on
  #   every read of the module, and the column is gone. A tag-only rollback
  #   yields UndefinedColumn on the board's worker picker, the workers screen
  #   and enrolment. Recovery is forward-fix, or `alembic downgrade 0069` per
  #   tenant first -- and that downgrade REFUSES while any resource is linked
  #   to no farm, by design, because pre-0070 farm_id is NOT NULL.
  #
  #   Shipping both halves at once was an explicit call, made knowing the
  #   above. The expand/contract split exists precisely so they can go
  #   separately; taking them together trades the rollback path for one deploy.
  #
  #   Pre-flight scans re-run against THIS database immediately before 0071 was
  #   written: zero cross-farm name collisions, zero memberships holding more
  #   than one worker row, across all three tenants. Both are hard failures in
  #   the migration if they ever become non-zero, with the offending names in
  #   the error.
  #
  #   FCM stops being inert: FCM_ENABLED/FCM_PROJECT_ID are set in this file's
  #   env block and FCM_SERVICE_ACCOUNT_JSON was hand-seeded into
  #   agripulse-app-secrets (ESO is off here, so ArgoCD will not revert it).
  #   Sends move from recording `skipped` to actually reaching Google.
  #
  #   frontend also moves: the bundle gains /settings/field-access and drops
  #   `farm_id` from its Resource type. api + workers + frontend all go to
  #   bc63176; tile-server stays 9d140cc.
  #
  #   TAG IS 7 CHARS -- git prints bc631764 (8); ghcr has bc63176. Bumping to
  #   what git printed would have been an ImagePullBackOff on every pod, with
  #   0071 already applied by the PreSync job.
  #
  #   Images verified BEFORE this commit by pulling them on the node itself,
  #   not by run conclusion and not via the packages REST API (which 404s for
  #   this repo): api sha256:cb22e4b7, workers sha256:c805a80a, frontend
  #   sha256:f07acf90. frontend again lagged api/workers by several minutes.
  # b65f42c = the google-auth lockfile fix. FCM was enabled by bc63176 and
  #   could not actually send: `google-auth` has been in [project]
  #   dependencies since the Scout push work but uv.lock was never
  #   regenerated, and the Dockerfile takes `uv sync --frozen` whenever a lock
  #   is present -- so the runtime image never contained it. Every setting was
  #   correct; the import was missing. Found by asking the running pod to mint
  #   a token, not by reading config.
  #
  #   Backend-only. The frontend image for b65f42c is BYTE-IDENTICAL to
  #   bc63176 (both sha256:f07acf90), so it stays on bc63176 rather than
  #   cycling a pod to ship the same bytes under a different tag.
  #
  #   No migration. Plain tag revert to bc63176 is a safe rollback -- it only
  #   returns push to the broken-but-harmless state it was already in.
  #
  #   Images verified by pulling on the node before this commit:
  #   api sha256:6d0ce8ce, workers sha256:ec1410a1.
  # d5feb37 = #413, three bugs that made a correctly-enrolled scout unable to
  #   work. All three reported themselves as a bad credential when the
  #   credential was fine, which is why they took a live handset to find.
  #
  #   Backend half only. Two of the three fixes are in `mobile/`, which ships
  #   as an APK rather than a deployed service, so they land in the repo and
  #   take effect when the APK is rebuilt -- NOT with this bump. What deploys
  #   here is:
  #     * `_split_full_name` no longer leaves lastName empty. This realm has
  #       VERIFY_PROFILE enabled with both name fields required, so a
  #       single-word name ("Majed") made Keycloak reject the direct grant
  #       with "Account is not fully set up" -- on the phone, worded as a bad
  #       credential, with nothing in any log.
  #     * `normalise_phone` requires exactly 12 digits for +20. The generic
  #       8-15 window accepted a number one digit short, which does not fail:
  #       it mints a working account under a number nobody owns, after which
  #       the scout cannot sign in with their real number.
  #
  #   Both apply to every future enrolment immediately. Existing bad rows are
  #   NOT repaired by this: the KC username is set only at creation and there
  #   is no rename path, so a typo'd scout must be deleted and re-enrolled.
  #
  #   No migration. Frontend and tile-server unchanged. Plain tag revert to
  #   b65f42c is a safe rollback.
  #
  #   Images verified by pulling on the node before this commit:
  #   api sha256:5c30b43e, workers sha256:afa2f40d.
  # 0e67d59 = #414, signal capture on a block from the Farm Console inspector.
  #   The console could edit a block's agronomics, crop, grid and responsible
  #   agronomist but not log an observation against it -- the only capture
  #   surface was /signals -> Log, which re-picks the farm and hunts for the
  #   block in a dropdown, throwing away the block context the console already
  #   has and filing the reading against the wrong unit when the pick is wrong.
  #
  #   FRONTEND-ONLY -- no backend delta, so api/workers stay on d5feb37 and
  #   tile-server on 9d140cc. No migration. Unlike crop attributes (which
  #   needed block_crop_attribute_values plus a companion history table), a
  #   signal observation is already an immutable timestamped row carrying
  #   recorded_by, and the list endpoint already filters by block_id -- the
  #   observations ARE the history, so nothing new was persisted.
  #
  #   #414 is the ONLY frontend change between bc63176 and this tag, so the
  #   promote ships exactly this feature. Plain tag revert to bc63176 is a
  #   safe rollback: nothing else rides along and no schema moved.
  #
  #   NOT browser-verified. tsc/eslint/prettier clean and 120 unit tests pass
  #   (incl. 3 new), and CI's frontend job is green -- but the panel has never
  #   been rendered in a real browser, so first real render is in prod.
  #
  #   Image verified from the merge build's own log, not the job conclusion:
  #   pushing manifest for frontend:0e67d59@sha256:cc0a41ae.
  # f81df64 = #416, /platform/roles -- the first surface that shows what any
  #   role can actually do. Until now the only answers to "what can a
  #   FarmManager do?" were reading role_capabilities.yaml or a Python REPL.
  #
  #   Two halves, and the second one changes what users see:
  #
  #     * The page itself. GET /api/v1/admin/rbac/matrix returns all 10 roles
  #       and 94 capabilities in one payload, gated on the EXISTING
  #       platform.read -- no new capability, no migration. Read-only;
  #       editing grants at runtime is Phase 2 and is deliberately not here.
  #
  #     * A resync of frontend/src/rbac/capabilities.ts, which restates the
  #       whole matrix so useCapability can resolve locally from JWT claims.
  #       Nothing generated it and nothing checked it, and it had drifted in
  #       BOTH directions. Controls appear and disappear in prod:
  #         - BillingAdmin had no entry at all, so roleGrants() returned false
  #           for everything and the role saw nothing it was entitled to.
  #         - The Capability union listed 64 of 94 names; every non-wildcard
  #           role's grant set was short (TenantOwner 56/81, FarmManager
  #           42/56), hiding controls users were allowed to use.
  #         - Four grants existed ONLY on the frontend and are now gone:
  #           Agronomist -> plan.manage + alert_rule.manage, FarmManager ->
  #           alert_rule.manage, PlatformSupport -> irrigation.schedule.read.
  #           These rendered buttons that 403 on click. Removing them takes
  #           buttons away from anyone whose ONLY role is FarmManager or
  #           Agronomist; anyone also holding a tenant role keeps the
  #           capability through that tier.
  #
  #   api/workers move off d5feb37 for the first time since #413. This commit
  #   is the ONLY backend change in that range and there are NO migrations in
  #   it, so the bump ships exactly this feature -- verified with
  #   `git log d5feb37..f81df64 -- backend/` and a diff of backend/migrations/.
  #   tile-server unchanged. Plain tag revert to d5feb37 (api/workers) and
  #   0e67d59 (frontend) is a safe rollback; no schema moved.
  #
  #   NOT browser-verified. tsc/eslint/ruff/black clean, 747 frontend tests,
  #   20 backend RBAC unit tests and 4 integration tests against a real
  #   Postgres all pass, and CI is fully green -- but the page has never been
  #   rendered in a real browser, so first real render is in prod.
  #
  #   Images verified from the merge build's own log, not the job conclusion:
  #   api:f81df64@sha256:83269183, workers:f81df64@sha256:d82a1de0,
  #   frontend:f81df64@sha256:f2feccac.
  # 43c76e8 = #415. GET /me/work, plus the language picker and the
  #   reachability probe salvaged from a promote branch.
  #
  #   /me/work closes a gap found by using the product: a supervisor put a
  #   scout on four board activities and the scout's app showed an empty
  #   list. "Assign this to X" writes a different column on every surface and
  #   the three do not share a key space --
  #     scouting_visits.assigned_to            -> users.id
  #     plan_activities.assigned_membership_id -> tenant_memberships.id
  #     activity_resources.resource_id         -> resources.id -> membership
  #   -- and the phone could only query the first. Board work was
  #   structurally invisible to it: nothing failed and nothing logged.
  #
  #   Resolving that on the server is the only place it can be done: the
  #   chain crosses the schema boundary. It also only became possible after
  #   0071 made resources.membership_id unique.
  #
  #   The endpoint carries NO capability gate, deliberately: every row is one
  #   where the caller is the assignee, and gating it would hide board work
  #   from a Scout, who holds no plan_activity.complete.
  #
  #   api + workers only. The frontend bundle is unchanged by this branch, so
  #   it stays on f81df64 rather than cycling a pod for identical bytes. The
  #   two mobile-facing changes ship in the APK, not here.
  #
  #   No migration. Plain tag revert to f81df64 is a clean rollback.
  #
  #   Images verified by pulling them on the node before this commit:
  #   api sha256:c2be1506, workers sha256:d2ec410e.
  images:
    api:
      tag: "43c76e8"
    workers:
      tag: "43c76e8"
    frontend:
      tag: "f81df64"
    tileServer:
      tag: "9d140cc"
# Top-level env merges into every service chart's own env map (api + workers
# consume all of these; tile-server/frontend ignore the keys they don't read).
env:
  # PlatformAdmin identity MUST equal the Keycloak realm seed user
  # (agripulse-realm.json users[0].email = dev@agripulse.local), else the JWT
  # email won't match the platform_role_assignments row the bootstrap seeds
  # and login lands in tenant-user mode instead of PlatformAdmin. Switching to
  # a real admin email is a separate change that also reseeds the realm user.
  PLATFORM_ADMIN_EMAIL: dev@agripulse.local
  PLATFORM_ADMIN_FULL_NAME: Platform Admin
  # Copernicus Data Space Ecosystem (CDSE) — the EU's FREE Sentinel Hub
  # (10k PU/month). Replaces the expired commercial trial. Same SH Process/
  # Catalog API, so only these 4 env vars + SENTINEL_HUB_CLIENT_SECRET in the
  # hand-seeded agripulse-app-secrets differ. client_id is non-secret (paired
  # with the secret). CDSE OAuth client via dataspace.copernicus.eu.
  SENTINEL_HUB_CLIENT_ID: "sh-c6548100-d4ae-48e7-ba8e-898c7c9e9499"
  SENTINEL_HUB_OAUTH_URL: "https://identity.dataspace.copernicus.eu/auth/realms/CDSE/protocol/openid-connect/token"
  SENTINEL_HUB_PROCESS_URL: "https://sh.dataspace.copernicus.eu/api/v1/process"
  SENTINEL_HUB_CATALOG_URL: "https://sh.dataspace.copernicus.eu/api/v1/catalog/1.0.0/search"
  # Keycloak split-URL (Hetzner only): the public issuer host
  # keycloak.agripulse.cloud does NOT resolve inside the cluster, so only
  # KEYCLOAK_ISSUER (must match the JWT `iss`) stays public (chart default via
  # envHost); api/workers reach Keycloak over in-cluster DNS for token + JWKS.
  KEYCLOAK_BASE_URL: http://keycloak
  KEYCLOAK_JWKS_URL: http://keycloak/realms/agripulse/protocol/openid-connect/certs
  # Object storage = Cloudflare R2 (S3-compatible): region "auto" and a single
  # bucket with no per-env suffix. Endpoint + access keys arrive via the
  # agripulse-app-secrets Secret (envFrom), not here.
  S3_REGION: auto
  S3_BUCKET_UPLOADS: agripulse-imagery
  AWS_DEFAULT_REGION: auto
  # No Tempo on Hetzner — disable OTEL so the SDK doesn't retry-storm a
  # non-existent OTLP collector.
  OTEL_SDK_DISABLED: "true"
  # Forecast horizon stored per fetch. Default is 120h (5d); the Insights
  # weather chart requests a 7-day horizon, so bump to 168h (7d) — within
  # Open-Meteo's free-tier forecast range — so "next week" isn't clipped.
  WEATHER_FORECAST_HOURS: "168"
  # Push (AgriPulse Scout). Left unset, `fcm_enabled` defaults to false and
  # every send records `skipped` rather than `failed` — correct behaviour and
  # the quietest possible failure, which is how a pilot runs for a week
  # believing push works. The project id is not a secret; the service-account
  # key arrives as FCM_SERVICE_ACCOUNT_JSON in agripulse-app-secrets.
  FCM_ENABLED: "true"
  FCM_PROJECT_ID: "agripulse-scout"
# Plain Secrets loaded via envFrom (ESO is off; these are hand-seeded). The
# single shared overlay applies to every service chart, so api/workers/tile
# all load both — harmless (same R2 account creds; unused keys are ignored).
# Per-chart scoping would need per-chart value files (a #5 refinement).
extraEnvFromSecrets:
  - agripulse-app-secrets
  - agripulse-r2-gdal
# No External Secrets Operator on Hetzner — secrets seeded directly.
# `externalSecret` (api/workers) gates the ExternalSecret CR; `externalSecrets`
# (shared) gates the ClusterSecretStore. Both off.
externalSecret:
  enabled: false
externalSecrets:
  enabled: false # shared chart ClusterSecretStore
  # keycloak wrapper-chart ExternalSecrets (admin/db/promote) — ESO is off on
  # Hetzner, so these CRs would fail to apply (no external-secrets.io CRD).
  admin:
    enabled: false
  db:
    enabled: false
  promote:
    enabled: false
# No prometheus-operator on Hetzner → ServiceMonitor CRD absent; rendering one
# would fail to apply. (CNPG's PodMonitor is gated separately below.)
serviceMonitor:
  enabled: false
labels:
  partOf: agripulse
# Single node, no HA.
replicaCount: 1
ingress:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
keycloak:
  ingress:
    hostname: keycloak.agripulse.cloud
    hostnameStrict: true
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
  image:
    tag: "9d140cc"
  # No prometheus-operator on Hetzner → ServiceMonitor CRD absent.
  metrics:
    serviceMonitor:
      enabled: false
  # Live keycloak has no NetworkPolicy; the bitnami default would create one
  # that restricts traffic. Keep it off (single node, ingress-nginx fronts it).
  networkPolicy:
    enabled: false
# Promote-bootstrap PostSync hook reaches Keycloak in-cluster. On Hetzner the
# bitnami Service is `keycloak` (release name), not the chart default
# `keycloak-dev` (the old AWS App name) — point the hook at the right host.
promoteBootstrap:
  # Re-enabled with failOnError:false (the FOLLOW-UP the disabled note called
  # for). The original concern — a failed PostSync hook blocking the keycloak
  # sync when Keycloak is briefly unreachable — is now addressed: failOnError
  # false turns any step failure (or KC-unreachable) into a logged warning +
  # clean exit 0, so the sync is never blocked. The scripts are idempotent.
  #
  # Why it's needed: without it the agripulse-tenancy service-account client
  # keeps the realm-import PLACEHOLDER secret, so the api can't get an admin
  # token (401 unauthorized_client) and tenant provisioning fails. promote-kc-
  # tenancy.py sets the client secret from the hand-seeded TENANCY_CLIENT_SECRET
  # and is self-contained (httpx only), so it works even while the pinned api
  # image predates the promote-kc-admin.py dev_bootstrap helpers (that step just
  # logs a non-fatal warning until the image is promoted).
  enabled: true
  failOnError: false
  keycloakBaseUrl: http://keycloak
# external-dns on Cloudflare instead of Route53. No IRSA — the chart reads a
# Cloudflare API token from a Secret.
# TODO(hetzner-live): set provider=cloudflare + reference the CF token secret;
# confirm the external-dns chart values support it (or drop external-dns and
# manage the handful of records by hand in Cloudflare).
externalDns:
  serviceAccount:
    annotations: {}
# No cluster autoscaler on a fixed VM.
karpenter:
  enabled: false
# cert-manager: no IRSA. Single-node k3s with ports 80/443 public on the node,
# so HTTP-01 through ingress-nginx is the simplest issuer (no Cloudflare DNS
# token needed). This overrides the shared chart's AWS default (DNS-01 via
# Route53), matching the live cert-manager install + the two ClusterIssuers
# created this session. The ingress.annotations.cert-manager.io/cluster-issuer
# below + each service chart's rendered spec.tls block let ingress-shim
# auto-issue, replacing the manual /root/enable-tls.sh.
certManager:
  enabled: true
  acme:
    # Matches the live ACME account registration (avoids re-registering on the
    # GitOps cutover). LE only uses this for expiry notices.
    email: mohamed75soliman@gmail.com
    solvers:
      - http01:
          ingress:
            class: nginx
certManagerController:
  serviceAccount:
    annotations: {}
# api: no IRSA. R2 (S3-compatible) creds come from a Secret as env vars.
# TODO(hetzner-live): drop the IRSA SA annotation (done) and confirm the api
# chart reads R2 endpoint/key/secret from env rather than instance role.
serviceAccount:
  create: true
  annotations: {}
postgresCluster:
  instances: 1
  # The keycloak DB already exists on the adopted cluster, and this PostSync
  # hook (CREATE DATABASE IF NOT EXISTS) would re-run on every ArgoCD reconcile
  # — same hook-churn class as the promote hook. Off for adoption; re-enable for
  # from-scratch reproducibility.
  keycloakDbBootstrap:
    enabled: false
  # k3s local-path provisioner (repointed at the detachable volume /mnt/pgdata
  # by 02-node-bootstrap.sh) — overrides the chart's AWS gp3 default.
  storage:
    size: 100Gi
    storageClass: local-path
  walStorage:
    size: 30Gi
    storageClass: local-path
  # Match the live cluster (chart default 4Gi/8Gi) so adoption doesn't restart
  # the single PG instance (= brief full-app downtime). Tune later in a window.
  resources:
    requests:
      cpu: "1"
      memory: 4Gi
    limits:
      cpu: "2"
      memory: 8Gi
  # No IRSA on Hetzner.
  serviceAccountAnnotations: {}
  # No prometheus-operator → no PodMonitor CRD. CNPG tolerates the missing CRD
  # (warns) but gate it off for a clean apply.
  monitoring:
    enablePodMonitor: false
  # Barman backups → Cloudflare R2 via static S3 creds from the agripulse-r2
  # Secret (no IRSA). Single bucket, no per-env suffix. endpointURL carries
  # only the CF account id (an identifier, not a credential — the R2 access
  # keys live in the agripulse-r2 Secret), so it is safe to commit and keeps
  # the CNPG backup fully GitOps-managed.
  backup:
    barmanObjectStore:
      destinationPath: "s3://agripulse-pg-backup/pg"
      endpointURL: "https://83c91caacdfd03a1e6cb07e4fdf882a4.r2.cloudflarestorage.com"
      s3Credentials:
        inheritFromIAMRole: false
        secretName: agripulse-r2
        accessKeyIdKey: ACCESS_KEY_ID
        secretAccessKeyKey: SECRET_ACCESS_KEY
migrations:
  enabled: true
# Keep each chart's own resources (api 512Mi, tile-server 2Gi for GDAL, etc.) —
# the cx43 node (8 vCPU / 16 GiB) fits them, and the live cluster runs on these.
# A blanket override here would shrink tile-server to 256Mi and OOM GDAL.
# Single light-worker replica (matches live; chart default is 2).
workloads:
  light:
    replicaCount: 1
