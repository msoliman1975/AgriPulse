image:
  repository: ghcr.io/msoliman1975/agripulse/api
  tag:
    "" # Empty â†’ falls back to .Chart.AppVersion. Workers
    # share the API image to keep migrations and code
    # paths in lockstep.
  pullPolicy: IfNotPresent
imagePullSecrets: []

# See infra/helm/shared/values.yaml; overlays override `global.env` +
# `global.envHost`. Empty `images.workers.tag` seed for the CD-12
# imageRef helper.
global:
  env: dev
  envHost: dev.agripulse.cloud
  images:
    workers:
      tag: ""

revisionHistoryLimit: 5

serviceAccount:
  # irsa: required-from-overlay              # workers share the api role
  create: true # (same image, same AWS calls). ARN
  name: "" # is set per-env in
  annotations: {} # infra/argocd/overlays/<env>/values.yaml.

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# Same env as the API; the worker uses settings.py to find Celery broker,
# DB, etc. Per-env overlays override hosts.
env:
  APP_ENV: production
  APP_LOG_LEVEL: INFO
  DATABASE_URL: postgresql+asyncpg://agripulse@agripulse-pg-rw:5432/agripulse
  DATABASE_SYNC_URL: postgresql+psycopg://agripulse@agripulse-pg-rw:5432/agripulse
  REDIS_URL: redis://agripulse-redis:6379/0
  CELERY_BROKER_URL: redis://agripulse-redis:6379/1
  CELERY_RESULT_BACKEND: redis://agripulse-redis:6379/2
  KEYCLOAK_ISSUER: "https://keycloak.{{ .Values.global.envHost }}/realms/agripulse"
  KEYCLOAK_AUDIENCE: agripulse-api
  KEYCLOAK_JWKS_URL: "https://keycloak.{{ .Values.global.envHost }}/realms/agripulse/protocol/openid-connect/certs"
  # See api/values.yaml — service is `observability-tempo`, not `tempo`.
  OTEL_EXPORTER_OTLP_ENDPOINT: http://observability-tempo.observability.svc.cluster.local:4318
  # SMTP. The workers chart already pulled SMTP_PASSWORD from Secrets
  # Manager but carried none of the other four keys, so every send from a
  # worker fell back to the dev defaults in settings.py and dialled
  # localhost:1025 inside the pod. That is not theoretical: grid anomaly
  # alerts publish AlertOpenedV1 from `grid/tasks.py`, a Celery task, so
  # their whole email fan-out ran here. Same failure shape as the S3
  # defaults noted below. Values mirror api/values.yaml exactly.
  SMTP_HOST: smtp-relay.brevo.com
  SMTP_PORT: "587"
  SMTP_USERNAME: "aac72b001@smtp-brevo.com"
  SMTP_STARTTLS: "true"
  SMTP_FROM: "AgriPulse <admin@agripulse.tech>"
  # Origin the SPA is served from. See api/values.yaml.
  APP_BASE_URL: "https://app.{{ .Values.global.envHost }}"
  # Sentinel Hub OAuth client_id — see api/values.yaml for rationale.
  # Must be set in the per-env overlay alongside the SENTINEL_HUB_CLIENT_SECRET
  # crossRef; both halves are required or imagery.discover_scenes writes the
  # `__not_configured__` failed-job marker every refresh.
  SENTINEL_HUB_CLIENT_ID: ""
  # S3 (object storage) — see api/values.yaml for rationale. Imagery
  # workers write raw S2 bands + COGs into this bucket; without these
  # overrides the worker falls back to the dev-machine MinIO defaults
  # in backend/app/core/settings.py and every acquire_scene job dies
  # with `s3_put_failed: Could not connect to ... http://localhost:9000`.
  S3_ENDPOINT_URL: ""
  S3_REGION: eu-south-1
  S3_PATH_STYLE: "false"
  S3_ACCESS_KEY_ID: ""
  S3_SECRET_ACCESS_KEY: ""
  S3_BUCKET_UPLOADS: "agripulse-imagery-{{ .Values.global.env }}"

# Mirrors infra/helm/api/values.yaml — see that file for the rationale on
# dropping the consolidated `agripulse/api` SM blob in favor of crossRefs
# + a CNPG-managed k8s Secret for DATABASE_PASSWORD.
externalSecret:
  enabled: true
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  # CD-9 per-purpose secrets at `agripulse/<env>/<purpose>`. SMTP is
  # included here because workers send notification email too — keeping
  # this in sync with the API chart is the documented gotcha in
  # docs/runbooks/seeding-secrets.md.
  crossRefs:
    - secretKey: SMTP_PASSWORD
      remoteKey: "agripulse/{{ .Values.global.env }}/brevo-smtp-password"
    - secretKey: JWT_SIGNING_KEY
      remoteKey: "agripulse/{{ .Values.global.env }}/jwt-signing-key"
    - secretKey: SENTINEL_HUB_CLIENT_SECRET
      remoteKey: "agripulse/{{ .Values.global.env }}/sentinel-hub-client-secret"
    - secretKey: KEYCLOAK_CLIENT_SECRET
      remoteKey: "agripulse/{{ .Values.global.env }}/keycloak-client-secret"

# DATABASE_PASSWORD is sourced from the CNPG-managed `<cluster>-app` Secret.
databasePasswordSecret:
  name: agripulse-pg-app
  key: password

# Three workloads off the same image. light/heavy queues are conventional
# names per ARCHITECTURE.md Â§ 3.1; beat is the singleton scheduler.
workloads:
  light:
    enabled: true
    replicaCount: 2
    command:
      - celery
      - --app
      - workers.light.main:app
      - worker
      - --loglevel=INFO
      - --queues=light
      - --concurrency=4
    # Memory measured on the live cluster 2026-08-23, not estimated.
    # `--concurrency=4` means five Python processes share this cgroup, and
    # each imports the whole app. Per-process RSS was 146/154/135/133/131 MiB;
    # RSS double-counts the pages shared by fork, so the cgroup charged
    # 449 MiB of `anon`, plus 12 MiB of page cache = 469 MiB AT IDLE.
    #
    # At 512Mi that left 43 MiB of headroom, and only the 12 MiB of cache was
    # reclaimable. A full `indices.recompute_baselines_sweep` adds ~35 MiB and
    # gives it all back (anon 449.5 MiB before, 449.3 MiB after — no leak),
    # but it peaks at 504 MiB, i.e. 8 MiB short of the limit. Anything else
    # scheduled in that window goes over: the pod was OOMKilled (exit 137) on
    # 2026-08-22 and `memory.peak` had reached 511.99 MiB.
    #
    # So the sweep is the trigger, not the cause — the idle baseline is. 1Gi
    # leaves ~555 MiB of headroom over that baseline. The request moves to
    # 512Mi because 256Mi told the scheduler less than half the truth.
    # For scale: the heavy worker is allowed 4Gi and uses 229 MiB.
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
    pdb:
      enabled: true
      minAvailable: 1
  heavy:
    enabled: true
    replicaCount: 1
    command:
      - celery
      - --app
      - workers.heavy.main:app
      - worker
      - --loglevel=INFO
      - --queues=heavy
      - --concurrency=2
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 4Gi
    pdb:
      enabled: false # Singleton-ish; PDB would block evictions.
  beat:
    enabled: true
    replicaCount: 1 # Beat is a true singleton.
    command:
      - celery
      - --app
      - workers.beat.main:app
      - beat
      - --loglevel=INFO
      - --schedule=/tmp/celerybeat-schedule
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    pdb:
      enabled: false

probes:
  liveness:
    exec:
      command:
        [
          "sh",
          "-c",
          "celery --app workers.light.main:app inspect ping -d celery@$HOSTNAME || true",
        ]
    initialDelaySeconds: 30
    periodSeconds: 60
    timeoutSeconds: 10

# Stopgap until multi-arch CI lands — see infra/helm/api/values.yaml.
nodeSelector:
  kubernetes.io/arch: amd64
tolerations: []
affinity: {}
