image:
  repository: ghcr.io/msoliman1975/agripulse/tile-server
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# See infra/helm/shared/values.yaml; overlays override `global.env` +
# `global.envHost`. Empty `images.tileServer.tag` seed for the CD-12
# imageRef helper (camelCase because the chart name has a hyphen).
global:
  env: dev
  envHost: dev.agripulse.cloud
  images:
    tileServer:
      tag: ""

replicaCount: 2
revisionHistoryLimit: 5

serviceAccount:
  # irsa: required-from-overlay              # tile-server reads COGs from
  create: true # the imagery S3 bucket via boto3
  name: "" # — ARN is set per-env in
  # IRSA: the role ARN is set per-env in the ApplicationSet overlay so
  # tile-server pods can read COGs from the imagery bucket directly.
  annotations: {} # infra/argocd/overlays/<env>/values.yaml.

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    cert-manager.io/cluster-issuer: letsencrypt-staging
  # Final host renders as `${hostPrefix}.${global.envHost}`.
  hostPrefix: tiles
  pathPrefix: /
  tlsSecretName: agripulse-tile-server-tls

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

probes:
  liveness:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 5
  readiness:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5

env:
  AWS_DEFAULT_REGION: eu-south-1
  CORS_ALLOW_ORIGINS: "https://app.{{ .Values.global.envHost }}"
  DEFAULT_MAX_ZOOM: "22"
  DEFAULT_MIN_ZOOM: "0"
  GDAL_HTTP_MERGE_CONSECUTIVE_RANGES: "YES"
  # Upstream ghcr.io/developmentseed/titiler image binds gunicorn to $PORT
  # (default 80). Service + probes target 8000, so pin PORT to match.
  PORT: "8000"
  # The upstream image defaults to ONE gunicorn worker, so every tile render
  # on the platform serialised through a single Python process. That is the
  # dominant cost when the Farm Console repaints: a farm view asks for ~65
  # tiles at once and they queue behind each other, which measured as ~1.6s of
  # wall clock for 36 parallel requests against a pod using 7m of CPU. The
  # work is mostly waiting on range reads from R2, so workers overlap well.
  WEB_CONCURRENCY: "4"
  # Per-PROCESS GDAL read cache, so it multiplies by WEB_CONCURRENCY. Dropped
  # from the image's 512MB to 128MB to keep four workers at the same total
  # cache footprint as the single worker had, well inside the 2Gi limit
  # (observed RSS with one worker: 274Mi).
  VSI_CACHE_SIZE: "134217728"

serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s

hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 80

pdb:
  enabled: true
  minAvailable: 1

# Stopgap until multi-arch CI lands — see infra/helm/api/values.yaml.
nodeSelector:
  kubernetes.io/arch: amd64
tolerations: []
affinity: {}
