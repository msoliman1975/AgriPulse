# AgriPulse email theme.
#
# parent=base gives us Keycloak's message bundle and the FreeMarker
# helpers (msg, kcSanitize, linkExpirationFormatter) without inheriting
# any markup — the base email templates are a bare <html><body> and a
# raw link, which is what these files replace.
#
# We override html/template.ftl outright, so the layout below is ours
# end to end. Any Keycloak email we have NOT written a template for
# still falls through to base and renders unbranded; today that is only
# templates for flows this realm has switched off (self-registration,
# email verification, OTP).
#
# locales: English only. The realm has internationalizationEnabled unset,
# so Keycloak has one language to render in. Product email (alerts,
# recommendations) is bilingual because it is sent by the api, not by
# Keycloak — see backend/migrations/public/versions/0070_*.py.
parent=base
locales=en
