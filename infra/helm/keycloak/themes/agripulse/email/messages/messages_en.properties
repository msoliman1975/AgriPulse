# Subject lines. Keycloak reads these by key; the values override the
# base bundle's wording, which says "Update Your Account" and reads like
# a system notice rather than an invitation.
#
# No [AgriPulse] prefix: the From name is already "AgriPulse" in every
# inbox, so the prefix spends subject-line width on a word the reader
# can already see.
executeActionsSubject=Set your AgriPulse password
passwordResetSubject=Reset your AgriPulse password
