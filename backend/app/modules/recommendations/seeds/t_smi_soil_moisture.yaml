            text_ar: أعد قراءة SMI في أول مشهد صافٍ وتأكد أنه عاد داخل النطاق.

  leaf_out_of_band_large:
    label_en: SMI below the large-tree band
    label_ar: SMI دون نطاق الشجرة كبيرة
    outcome:
