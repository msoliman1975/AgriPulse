            text_ar: أعد قراءة SMI في أول مشهد صافٍ وتأكد أنه عاد داخل النطاق.

  leaf_deficit_out_of_band_small:
    label_en: SMI below the small-tree band (deficit window)
    label_ar: SMI دون نطاق الشجرة صغيرة (نافذة العجز)
    outcome:
