# t_evi_canopy_vigour — EVI against the mango index guide's band for the
# block's recorded tree size.
#
# Source: tatoo Docs/Mango indices- 28_8/AgriPulse_Mango_Indices_Plan_EN.xlsx,
# 10 m column of the three stage value sheets.
#
# Size is the axis that matters. Of the workbook's 72 index x size x
# productivity combinations, 64 hold the same range in all three stage
# sheets, so this tree takes no stage input; only CWSI and SMI genuinely
# move, and they move because irrigation is cut on purpose before harvest.
#
# EVI uses the blue band, which is the noisiest Sentinel-2 band over bright
# Egyptian sand.
# On a small block expect EVI to be less steady than SAVI or MSAVI.

code: t_evi_canopy_vigour
name_en: T_EVI — canopy vigour on dense canopy against the band for this tree size
name_ar: T_EVI — حيوية المجموع الكثيف مقابل نطاق حجم الشجرة
description_en: >-
  Checks canopy density using EVI, which keeps separating healthy from
  unhealthy on a large leafy mango tree where NDVI flattens near its
  ceiling. Branches on the block's recorded Tree size and compares EVI
  against the band the guide gives for that size. Opens one card when the
  reading is below the band. Needs the Tree size attribute to be set on
  the crop assignment.
description_ar: >-
  يفحص كثافة المجموع باستخدام EVI، الذي يظل يميّز السليم من غير السليم على
  شجرة المانجو الكبيرة كثيفة الأوراق حيث يتشبع NDVI. يتفرّع على حجم الشجرة
  المسجّل للقطعة ويقارن EVI بالنطاق الذي يعطيه الدليل لهذا الحجم. يفتح
  بطاقة واحدة عندما تكون القراءة دون النطاق. يحتاج ضبط خاصية حجم الشجرة
  على تخصيص المحصول.

crop_path: mango
country_codes: [EG]
applicable_regions: []

evidence:
  confidence: medium
  notes: >-
    Thresholds are the actionable edge of each size's 10 m band in the
    AgriPulse mango index guide. The guide states its own limit plainly:
    no published study measures these indices for these nine mango
    varieties, and field ground-truthing is recommended before the ranges
    drive a decision. Every bound is therefore a tunable parameter, and
    small-tree results carry lower confidence because the guide grades
    every small-tree cell Low. EVI uses the blue band, which is the
    noisiest Sentinel-2 band over bright Egyptian sand. On a small block
    expect EVI to be less steady than SAVI or MSAVI.
  citations:
    - source_type: remote_sensing
      title: >-
        AgriPulse — Mango Indices & Agriculture Plan (English), Index
        Definitions + the three stage value sheets, 10 m column
      url: https://agripulse.cloud/docs/mango-index-guide
      year: 2026

transferability:
  egypt: high
  middle_east: medium
  global: low

parameters:
  small_evi_floor:
    type: number
    default: 0.05
    min: -2.0
    max: 3.0
    description: >-
      EVI value below which a small-tree mango block is outside the range
      the index guide expects (guide band 0.05 to 0.14 at 10 m).
  medium_evi_floor:
    type: number
    default: 0.14
    min: -2.0
    max: 3.0
    description: >-
      EVI value below which a medium-tree mango block is outside the range
      the index guide expects (guide band 0.14 to 0.24 at 10 m).
  large_evi_floor:
    type: number
    default: 0.43
    min: -2.0
    max: 3.0
    description: >-
      EVI value below which a large-tree mango block is outside the range
      the index guide expects (guide band 0.43 to 0.59 at 10 m).

root: size_small
nodes:
  size_small:
    label_en: Are the trees in the small size class?
    label_ar: هل الأشجار في فئة الحجم صغيرة؟
    condition:
      tree:
        op: eq
        left:
          source: crop_attribute
          code: tree_size_class
          key: value
        right: small
    on_match: small_check
    on_miss: size_medium

  size_medium:
    label_en: Are the trees in the medium size class?
    label_ar: هل الأشجار في فئة الحجم متوسطة؟
    condition:
      tree:
        op: eq
        left:
          source: crop_attribute
          code: tree_size_class
          key: value
        right: medium
    on_match: medium_check
    on_miss: size_large

  size_large:
    label_en: Are the trees in the large size class?
    label_ar: هل الأشجار في فئة الحجم كبيرة؟
    condition:
      tree:
        op: eq
        left:
          source: crop_attribute
          code: tree_size_class
          key: value
        right: large
    on_match: large_check
    on_miss: leaf_size_unknown

  small_check:
    label_en: Is EVI below the small-tree bound?
    label_ar: هل EVI دون حدّ الشجرة صغيرة؟
    condition:
      tree:
        op: lt
        left:
          source: indices
          index_code: evi
          key: mean
        right:
          source: params
          name: small_evi_floor
    on_match: leaf_out_of_band_small
    on_miss: leaf_in_band

  medium_check:
    label_en: Is EVI below the medium-tree bound?
    label_ar: هل EVI دون حدّ الشجرة متوسطة؟
    condition:
      tree:
        op: lt
        left:
          source: indices
          index_code: evi
          key: mean
        right:
          source: params
          name: medium_evi_floor
    on_match: leaf_out_of_band_medium
    on_miss: leaf_in_band

  large_check:
    label_en: Is EVI below the large-tree bound?
    label_ar: هل EVI دون حدّ الشجرة كبيرة؟
    condition:
      tree:
        op: lt
        left:
          source: indices
          index_code: evi
          key: mean
        right:
          source: params
          name: large_evi_floor
    on_match: leaf_out_of_band_large
    on_miss: leaf_in_band

  leaf_out_of_band_small:
    label_en: EVI below the small-tree band
    label_ar: EVI دون نطاق الشجرة صغيرة
    outcome:
      action_type: scout
      severity: info
      confidence: 0.4
      valid_for_hours: 168
      parameters:
        priority: medium
      text_en: >-
        EVI is below the band the guide expects for this tree size. The
        guide says EVI performs best exactly here, on dense mango canopy.
        The guide's small-tree band for EVI at 10 m is 0.05 to 0.14. The
        guide grades every small-tree cell Low, so treat this as advisory
        and confirm on the ground.
      text_ar: >-
        قيمة EVI دون النطاق الذي يتوقعه الدليل لهذا الحجم. يقول الدليل إن
        EVI يعمل بأفضل صورة هنا تحديدًا، على مجموع المانجو الكثيف. نطاق
        الدليل للشجرة صغيرة في EVI عند 10 م هو من 0.05 إلى 0.14. يصنّف
        الدليل كل خلايا الشجرة الصغيرة بثقة منخفضة، فاعتبرها استرشادية
        وأكّدها في الأرض.
      actions:
        immediate:
          - text_en: >-
              Treat this as the reading to trust over NDVI on a large
              tree.
            text_ar: >-
              اعتبر هذه القراءة أولى بالثقة من NDVI على الشجرة الكبيرة.
        short_term:
          - text_en: >-
              Scout the block for water shortage, pest, disease, or root
              damage.
            text_ar: >-
              استكشف القطعة بحثًا عن نقص ماء، أو آفة، أو مرض، أو ضرر
              بالجذور.
          - text_en: >-
              Confirm the recorded tree size before acting on the number.
            text_ar: >-
              تأكد من حجم الشجرة المسجّل قبل التصرف بناءً على الرقم.
        monitoring:
          - text_en: Re-read EVI on the next clear scene and check it has moved back inside the band.
            text_ar: أعد قراءة EVI في أول مشهد صافٍ وتأكد أنه عاد داخل النطاق.

  leaf_out_of_band_medium:
    label_en: EVI below the medium-tree band
    label_ar: EVI دون نطاق الشجرة متوسطة
    outcome:
      action_type: scout
      severity: warning
      confidence: 0.55
      valid_for_hours: 168
      parameters:
        priority: medium
      text_en: >-
        EVI is below the band the guide expects for this tree size. The
        guide says EVI performs best exactly here, on dense mango canopy.
        The guide's medium-tree band for EVI at 10 m is 0.14 to 0.24.
      text_ar: >-
        قيمة EVI دون النطاق الذي يتوقعه الدليل لهذا الحجم. يقول الدليل إن
        EVI يعمل بأفضل صورة هنا تحديدًا، على مجموع المانجو الكثيف. نطاق
        الدليل للشجرة متوسطة في EVI عند 10 م هو من 0.14 إلى 0.24.
      actions:
        immediate:
          - text_en: >-
              Treat this as the reading to trust over NDVI on a large
              tree.
            text_ar: >-
              اعتبر هذه القراءة أولى بالثقة من NDVI على الشجرة الكبيرة.
        short_term:
          - text_en: >-
              Scout the block for water shortage, pest, disease, or root
              damage.
            text_ar: >-
              استكشف القطعة بحثًا عن نقص ماء، أو آفة، أو مرض، أو ضرر
              بالجذور.
          - text_en: >-
              Confirm the recorded tree size before acting on the number.
            text_ar: >-
              تأكد من حجم الشجرة المسجّل قبل التصرف بناءً على الرقم.
        monitoring:
          - text_en: Re-read EVI on the next clear scene and check it has moved back inside the band.
            text_ar: أعد قراءة EVI في أول مشهد صافٍ وتأكد أنه عاد داخل النطاق.

  leaf_out_of_band_large:
    label_en: EVI below the large-tree band
    label_ar: EVI دون نطاق الشجرة كبيرة
    outcome:
      action_type: scout
      severity: warning
      confidence: 0.65
      valid_for_hours: 168
      parameters:
        priority: medium
      text_en: >-
        EVI is below the band the guide expects for this tree size. The
        guide says EVI performs best exactly here, on dense mango canopy.
        The guide's large-tree band for EVI at 10 m is 0.43 to 0.59.
      text_ar: >-
        قيمة EVI دون النطاق الذي يتوقعه الدليل لهذا الحجم. يقول الدليل إن
        EVI يعمل بأفضل صورة هنا تحديدًا، على مجموع المانجو الكثيف. نطاق
        الدليل للشجرة كبيرة في EVI عند 10 م هو من 0.43 إلى 0.59.
      actions:
        immediate:
          - text_en: >-
              Treat this as the reading to trust over NDVI on a large
              tree.
            text_ar: >-
              اعتبر هذه القراءة أولى بالثقة من NDVI على الشجرة الكبيرة.
        short_term:
          - text_en: >-
              Scout the block for water shortage, pest, disease, or root
              damage.
            text_ar: >-
              استكشف القطعة بحثًا عن نقص ماء، أو آفة، أو مرض، أو ضرر
              بالجذور.
          - text_en: >-
              Confirm the recorded tree size before acting on the number.
            text_ar: >-
              تأكد من حجم الشجرة المسجّل قبل التصرف بناءً على الرقم.
        monitoring:
          - text_en: Re-read EVI on the next clear scene and check it has moved back inside the band.
            text_ar: أعد قراءة EVI في أول مشهد صافٍ وتأكد أنه عاد داخل النطاق.

  leaf_in_band:
    label_en: No action — EVI inside the band for this tree size
    label_ar: لا إجراء — EVI داخل نطاق هذا الحجم
    outcome:
      action_type: no_action
      severity: info
      confidence: 0.9
      parameters: {}
      text_en: >-
        EVI is inside the range the mango index guide expects for this
        tree size.
      text_ar: >-
        EVI داخل النطاق الذي يتوقعه دليل مؤشرات المانجو لهذا الحجم.

  leaf_size_unknown:
    label_en: No action — tree size not recorded, so there is no band to compare against
    label_ar: لا إجراء — حجم الشجرة غير مسجّل فلا يوجد نطاق للمقارنة
    outcome:
      action_type: no_action
      severity: info
      confidence: 0.9
      parameters: {}
      text_en: >-
        This rule needs the block's Tree size attribute. Open the block's
        crop assignment, set Tree size, and the rule starts running on the
        next sweep.
      text_ar: >-
        تحتاج هذه القاعدة خاصية حجم الشجرة للقطعة. افتح تخصيص المحصول
        للقطعة واضبط حجم الشجرة لتبدأ القاعدة في العمل مع أول تمريرة.
