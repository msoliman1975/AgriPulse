# mango_stress_induction_v1 — warn when a mango block is well-watered during
# the cool flowering-induction window, which risks a vegetative flush
# instead of flowering (and a lost fruiting season).
#
# Study-backed AND logic: water status alone does NOT induce flowering —
# floral induction needs the cool window (bud dormancy ~15 C; warm ~30 C
# suppresses it). Suspending irrigation at warm temps produced only
# vegetative growth ('Tommy Atkins', Florida); withholding irrigation in
# the cool season increased flowering ~20% and yield ~17% ('Kensington
# Pride'). So the warning fires only when BOTH hold during pre_flowering:
#   * canopy moisture is high (well-watered)  — NDMI mean above threshold
#   * the 72h forecast min air temp is in the cool induction band
#
# Moisture is read from NDMI (NIR-SWIR), the canopy/leaf water index — NOT
# the engine's `ndwi` (McFeeters Green-NIR = open-water). NDMI needs SWIR,
# so it's a Sentinel-2 signal (unavailable on PlanetScope 3m).

code: mango_stress_induction_v1
name_en: Mango — stress induction (withhold irrigation to flower)
name_ar: المانجو — التصويم لدفع التزهير
description_en: >-
  During the cool pre-flowering window, a well-watered mango canopy
  (high NDMI) risks pushing a vegetative flush instead of flowering.
  Warns when canopy moisture is high AND the forecast is cool, so the
  grower can withhold irrigation to induce floral bud differentiation.
description_ar: >-
  خلال نافذة ما قبل التزهير الباردة، قد يدفع المجموع الخضري المُروى جيدًا
  (NDMI مرتفع) نموًا خضريًا بدلًا من التزهير. يُحذّر عندما تكون رطوبة
  المجموع مرتفعة والتوقع باردًا، ليتمكّن المزارع من تعطيش الأشجار لتحفيز
  التمايز الزهري.

crop_path: mango
applicable_regions: []

evidence:
  confidence: high
  notes: >-
    Water stress alone is insufficient for floral induction; it must
    coincide with the cool window (bud dormancy ~15 C, ~30 C suppresses).
    'Tommy Atkins' irrigation-suspension at 20 C gave only vegetative
    growth; 'Kensington Pride' withholding raised flowering ~20.5% and
    yield ~17%. Moisture tracked via NDMI (NIR-SWIR), not McFeeters NDWI.
  citations:
    - source_type: peer_reviewed
      title: >-
        Flowering of mango trees in containers as influenced by seasonal
        temperature and water stress
      url: https://www.sciencedirect.com/science/article/abs/pii/0304423894901279
      year: 1994
    - source_type: peer_reviewed
      title: >-
        Effect of water stress on flowering and yield of 'Kensington
        Pride' mango (ISHS Acta Horticulturae 509_30)
      url: https://ishs.org/ishs-article/509_30/
      year: 2000
    - source_type: research_institution
      title: National Mango Board — Mango Flowering Review
      url: https://www.mango.org/wp-content/uploads/2022/12/Mango-Flowering-Review_Italo-Cavalcante-atual.pdf
      year: 2022

transferability:
  egypt: high
  middle_east: high
  global: medium

parameters:
  wet_ndmi:
    type: number
    default: 0.30
    min: -1.0
    max: 1.0
    description: >-
      NDMI mean above which the canopy is considered well-watered during
      the induction window.
  cool_induction_c:
    type: number
    default: 15.0
    min: 0.0
    max: 30.0
    description: >-
      72h-forecast minimum air temperature (C) at/below which the cool
      flowering-induction window is considered active.

root: root
nodes:
  root:
    label_en: Is the block in the pre-flowering (induction) stage?
    label_ar: هل القطعة في مرحلة ما قبل التزهير (التصويم)؟
    condition:
      tree:
        op: eq
        left:
          source: block
          field: growth_stage
        right: pre_flowering
    on_match: wet_and_cool
    on_miss: leaf_no_action

  wet_and_cool:
    label_en: Is the canopy well-watered (high NDMI) while the forecast is cool?
    label_ar: هل المجموع مُروى جيدًا (NDMI مرتفع) والتوقع بارد؟
    condition:
      tree:
        all_of:
          - op: gt
            left:
              source: indices
              index_code: ndmi
              key: mean
            right:
              source: params
              name: wet_ndmi
          - op: le
            left:
              source: weather
              scope: forecast_72h
              field: air_temp_c_min
            right:
              source: params
              name: cool_induction_c
    on_match: leaf_warn
    on_miss: leaf_no_action

  leaf_warn:
    label_en: High moisture in the cool induction window — withhold irrigation
    label_ar: رطوبة عالية في نافذة التصويم الباردة — أوقف الريّ
    outcome:
      action_type: irrigate
      severity: warning
      confidence: 0.7
      valid_for_hours: 168
      parameters:
        priority: high
        direction: withhold
      text_en: >-
        The canopy is well-watered (high NDMI) during the cool
        flowering-induction window. Continued irrigation risks a
        vegetative flush instead of flowering. Withhold irrigation to
        induce floral bud differentiation while temperatures stay cool.
      text_ar: >-
        المجموع الخضري مُروى جيدًا (NDMI مرتفع) خلال نافذة التصويم الباردة.
        استمرار الريّ قد يؤدي لنمو خضري بدلًا من التزهير. أوقف الريّ لتحفيز
        التمايز الزهري بينما تبقى الحرارة منخفضة.
      actions:
        immediate:
          - text_en: Pause irrigation on this block during the cool induction window.
            text_ar: أوقف الريّ على هذه القطعة خلال نافذة التصويم الباردة.
        short_term:
          - text_en: >-
              Hold the dry-down for the rest of the induction window unless
              trees show wilting; then give a minimal survival irrigation.
            text_ar: >-
              حافظ على التعطيش لبقية نافذة التصويم ما لم تظهر الأشجار ذبولًا،
              وعندها اعطِ ريّة بقاء بسيطة.
        monitoring:
          - text_en: Track NDMI back down and watch for panicle emergence.
            text_ar: تابع انخفاض NDMI وراقب خروج النورات الزهرية.

  leaf_no_action:
    label_en: No action — not in induction or canopy not wet/cool
    label_ar: لا إجراء — ليست في التصويم أو المجموع غير مُروى/بارد
    outcome:
      action_type: no_action
      severity: info
      confidence: 0.9
      parameters: {}
      text_en: No induction-stage moisture risk detected.
      text_ar: لم يُكتشف خطر رطوبة في مرحلة التصويم.
