# t_msi_moisture_stress — MSI against the mango index guide's band for the
# block's recorded tree size.
#
# Source: tatoo Docs/Mango indices- 28_8/AgriPulse_Mango_Indices_Plan_EN.xlsx,
# 10 m column of the three stage value sheets.
#
# Size is the axis that matters. Of the workbook's 72 index x size x
# productivity combinations, 64 hold the same range in all three stage
# sheets, so this tree takes no stage input; only CWSI and SMI genuinely
# move, and they move because irrigation is cut on purpose before harvest.
#
# MSI is SWIR/NIR and NDMI is (NIR-SWIR)/(NIR+SWIR); the two are a monotone
# transform of each other, ndmi == (1 - msi) / (1 + msi).
# They cannot disagree and must never be counted as two votes.
# T_WATER_CONFIRM treats them as one.

code: t_msi_moisture_stress
name_en: T_MSI — moisture stress above the band for this tree size (inverted index)
name_ar: T_MSI — إجهاد الرطوبة فوق نطاق حجم الشجرة (مؤشر معكوس)
description_en: >-
  Checks water stress on an inverted scale. This index runs the opposite
  way to the others: a higher number means a thirstier tree. Branches on
  the block's recorded Tree size and compares MSI against the band the
  guide gives for that size. Opens one card when the reading is above the
  band. Needs the Tree size attribute to be set on the crop assignment.
description_ar: >-
  يفحص إجهاد الماء على مقياس معكوس. يعمل هذا المؤشر عكس البقية: الرقم
  الأعلى يعني شجرة أكثر عطشًا. يتفرّع على حجم الشجرة المسجّل للقطعة ويقارن
  MSI بالنطاق الذي يعطيه الدليل لهذا الحجم. يفتح بطاقة واحدة عندما تكون
  القراءة فوق النطاق. يحتاج ضبط خاصية حجم الشجرة على تخصيص المحصول.

crop_path: mango
country_codes: [EG]
applicable_regions: []

evidence:
  confidence: medium
  notes: >-
    Thresholds are the actionable edge of each size's 10 m band in the
    AgriPulse mango index guide. The guide states its own limit plainly:
    no published study measures these indices for these nine mango
    varieties, and field ground-truthing is recommended before the ranges
    drive a decision. Every bound is therefore a tunable parameter, and
    small-tree results carry lower confidence because the guide grades
    every small-tree cell Low. MSI is SWIR/NIR and NDMI is
    (NIR-SWIR)/(NIR+SWIR); the two are a monotone transform of each other,
    ndmi == (1 - msi) / (1 + msi). They cannot disagree and must never be
    counted as two votes. T_WATER_CONFIRM treats them as one.
  citations:
    - source_type: remote_sensing
      title: >-
        AgriPulse — Mango Indices & Agriculture Plan (English), Index
        Definitions + the three stage value sheets, 10 m column
      url: https://agripulse.cloud/docs/mango-index-guide
      year: 2026

transferability:
  egypt: high
  middle_east: medium
  global: low

parameters:
  small_msi_ceiling:
    type: number
    default: 1.3
    min: -2.0
    max: 3.0
    description: >-
      MSI value above which a small-tree mango block is outside the range
      the index guide expects (guide band 0.9 to 1.3 at 10 m).
  medium_msi_ceiling:
    type: number
    default: 0.9
    min: -2.0
    max: 3.0
    description: >-
      MSI value above which a medium-tree mango block is outside the range
      the index guide expects (guide band 0.6 to 0.9 at 10 m).
  large_msi_ceiling:
    type: number
    default: 0.45
    min: -2.0
    max: 3.0
    description: >-
      MSI value above which a large-tree mango block is outside the range
      the index guide expects (guide band 0.25 to 0.45 at 10 m).

root: size_small
nodes:
  size_small:
    label_en: Are the trees in the small size class?
    label_ar: هل الأشجار في فئة الحجم صغيرة؟
    condition:
      tree:
        op: eq
        left:
          source: crop_attribute
          code: tree_size_class
          key: value
        right: small
    on_match: small_check
    on_miss: size_medium

  size_medium:
    label_en: Are the trees in the medium size class?
    label_ar: هل الأشجار في فئة الحجم متوسطة؟
    condition:
      tree:
        op: eq
        left:
          source: crop_attribute
          code: tree_size_class
          key: value
        right: medium
    on_match: medium_check
    on_miss: size_large

  size_large:
    label_en: Are the trees in the large size class?
    label_ar: هل الأشجار في فئة الحجم كبيرة؟
    condition:
      tree:
        op: eq
        left:
          source: crop_attribute
          code: tree_size_class
          key: value
        right: large
    on_match: large_check
    on_miss: leaf_size_unknown

  small_check:
    label_en: Is MSI above the small-tree bound?
    label_ar: هل MSI فوق حدّ الشجرة صغيرة؟
    condition:
      tree:
        op: gt
        left:
          source: indices
          index_code: msi
          key: mean
        right:
          source: params
          name: small_msi_ceiling
    on_match: leaf_out_of_band_small
    on_miss: leaf_in_band

  medium_check:
    label_en: Is MSI above the medium-tree bound?
    label_ar: هل MSI فوق حدّ الشجرة متوسطة؟
    condition:
      tree:
        op: gt
        left:
          source: indices
          index_code: msi
          key: mean
        right:
          source: params
          name: medium_msi_ceiling
    on_match: leaf_out_of_band_medium
    on_miss: leaf_in_band

  large_check:
    label_en: Is MSI above the large-tree bound?
    label_ar: هل MSI فوق حدّ الشجرة كبيرة؟
    condition:
      tree:
        op: gt
        left:
          source: indices
          index_code: msi
          key: mean
        right:
          source: params
          name: large_msi_ceiling
    on_match: leaf_out_of_band_large
    on_miss: leaf_in_band

  leaf_out_of_band_small:
    label_en: MSI above the small-tree band
    label_ar: MSI فوق نطاق الشجرة صغيرة
    outcome:
      action_type: irrigate
      severity: info
      confidence: 0.4
      valid_for_hours: 168
      parameters:
        priority: medium
      text_en: >-
        MSI is above the band the guide expects for this tree size. On
        this index that means more water stress, not less. The guide's
        small-tree band for MSI at 10 m is 0.9 to 1.3. The guide grades
        every small-tree cell Low, so treat this as advisory and confirm
        on the ground.
      text_ar: >-
        قيمة MSI فوق النطاق الذي يتوقعه الدليل لهذا الحجم. على هذا المؤشر
        يعني ذلك إجهاد ماء أكبر لا أقل. نطاق الدليل للشجرة صغيرة في MSI
        عند 10 م هو من 0.9 إلى 1.3. يصنّف الدليل كل خلايا الشجرة الصغيرة
        بثقة منخفضة، فاعتبرها استرشادية وأكّدها في الأرض.
      actions:
        immediate:
          - text_en: >-
              Check the irrigation reached this block.
            text_ar: >-
              تأكد أن الريّ وصل هذه القطعة.
        short_term:
          - text_en: >-
              Do not count this as a separate finding from T_NDMI — the
              two carry the same signal.
            text_ar: >-
              لا تعتبرها نتيجة مستقلة عن T_NDMI — يحمل الاثنان الإشارة
              نفسها.
        monitoring:
          - text_en: Re-read MSI on the next clear scene and check it has moved back inside the band.
            text_ar: أعد قراءة MSI في أول مشهد صافٍ وتأكد أنه عاد داخل النطاق.

  leaf_out_of_band_medium:
    label_en: MSI above the medium-tree band
    label_ar: MSI فوق نطاق الشجرة متوسطة
    outcome:
      action_type: irrigate
      severity: warning
      confidence: 0.55
      valid_for_hours: 168
      parameters:
        priority: medium
      text_en: >-
        MSI is above the band the guide expects for this tree size. On
        this index that means more water stress, not less. The guide's
        medium-tree band for MSI at 10 m is 0.6 to 0.9.
      text_ar: >-
        قيمة MSI فوق النطاق الذي يتوقعه الدليل لهذا الحجم. على هذا المؤشر
        يعني ذلك إجهاد ماء أكبر لا أقل. نطاق الدليل للشجرة متوسطة في MSI
        عند 10 م هو من 0.6 إلى 0.9.
      actions:
        immediate:
          - text_en: >-
              Check the irrigation reached this block.
            text_ar: >-
              تأكد أن الريّ وصل هذه القطعة.
        short_term:
          - text_en: >-
              Do not count this as a separate finding from T_NDMI — the
              two carry the same signal.
            text_ar: >-
              لا تعتبرها نتيجة مستقلة عن T_NDMI — يحمل الاثنان الإشارة
              نفسها.
        monitoring:
          - text_en: Re-read MSI on the next clear scene and check it has moved back inside the band.
            text_ar: أعد قراءة MSI في أول مشهد صافٍ وتأكد أنه عاد داخل النطاق.

  leaf_out_of_band_large:
    label_en: MSI above the large-tree band
    label_ar: MSI فوق نطاق الشجرة كبيرة
    outcome:
      action_type: irrigate
      severity: warning
      confidence: 0.65
      valid_for_hours: 168
      parameters:
        priority: medium
      text_en: >-
        MSI is above the band the guide expects for this tree size. On
        this index that means more water stress, not less. The guide's
        large-tree band for MSI at 10 m is 0.25 to 0.45.
      text_ar: >-
        قيمة MSI فوق النطاق الذي يتوقعه الدليل لهذا الحجم. على هذا المؤشر
        يعني ذلك إجهاد ماء أكبر لا أقل. نطاق الدليل للشجرة كبيرة في MSI
        عند 10 م هو من 0.25 إلى 0.45.
      actions:
        immediate:
          - text_en: >-
              Check the irrigation reached this block.
            text_ar: >-
              تأكد أن الريّ وصل هذه القطعة.
        short_term:
          - text_en: >-
              Do not count this as a separate finding from T_NDMI — the
              two carry the same signal.
            text_ar: >-
              لا تعتبرها نتيجة مستقلة عن T_NDMI — يحمل الاثنان الإشارة
              نفسها.
        monitoring:
          - text_en: Re-read MSI on the next clear scene and check it has moved back inside the band.
            text_ar: أعد قراءة MSI في أول مشهد صافٍ وتأكد أنه عاد داخل النطاق.

  leaf_in_band:
    label_en: No action — MSI inside the band for this tree size
    label_ar: لا إجراء — MSI داخل نطاق هذا الحجم
    outcome:
      action_type: no_action
      severity: info
      confidence: 0.9
      parameters: {}
      text_en: >-
        MSI is inside the range the mango index guide expects for this
        tree size.
      text_ar: >-
        MSI داخل النطاق الذي يتوقعه دليل مؤشرات المانجو لهذا الحجم.

  leaf_size_unknown:
    label_en: No action — tree size not recorded, so there is no band to compare against
    label_ar: لا إجراء — حجم الشجرة غير مسجّل فلا يوجد نطاق للمقارنة
    outcome:
      action_type: no_action
      severity: info
      confidence: 0.9
      parameters: {}
      text_en: >-
        This rule needs the block's Tree size attribute. Open the block's
        crop assignment, set Tree size, and the rule starts running on the
        next sweep.
      text_ar: >-
        تحتاج هذه القاعدة خاصية حجم الشجرة للقطعة. افتح تخصيص المحصول
        للقطعة واضبط حجم الشجرة لتبدأ القاعدة في العمل مع أول تمريرة.
