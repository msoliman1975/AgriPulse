        monitoring:
          - text_en: Re-read CWSI on the next clear scene and check it has moved back inside the band.
            text_ar: أعد قراءة CWSI في أول مشهد صافٍ وتأكد أنه عاد داخل النطاق.

  leaf_deficit_out_of_band_small:
    label_en: CWSI above the small-tree band (deficit window)
    label_ar: CWSI فوق نطاق الشجرة صغيرة (نافذة العجز)
    outcome:
      action_type: irrigate
      severity: critical
      confidence: 0.4
      valid_for_hours: 168
      parameters:
        priority: high
      text_en: >-
        This block is inside its pre-harvest deficit window and its canopy
        is hotter than even that window allows. Deficit irrigation is
        meant to stress the tree, not damage the fruit. The guide's
        small-tree band for CWSI at 10 m is 0.38 to 0.63. The guide grades
        every small-tree cell Low, so treat this as advisory and confirm
        on the ground.
      text_ar: >-
        هذه القطعة داخل نافذة العجز قبل الحصاد ومجموعها أسخن مما تسمح به
        تلك النافذة. الهدف من الريّ الناقص إجهاد الشجرة لا إتلاف الثمار.
        نطاق الدليل للشجرة صغيرة في CWSI عند 10 م هو من 0.38 إلى 0.63.
        يصنّف الدليل كل خلايا الشجرة الصغيرة بثقة منخفضة، فاعتبرها
        استرشادية وأكّدها في الأرض.
      actions:
