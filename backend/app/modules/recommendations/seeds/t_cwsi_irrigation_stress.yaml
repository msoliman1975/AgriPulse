        ceiling. CWSI is computed against a fixed dry-canopy constant, and
        Egyptian summer surface temperature over sparse canopy on sand
        runs past it, so the value clips to 1.0 for stressed and healthy
        blocks alike. No irrigation decision can be read from it until
        that constant is calibrated against local measurements.
      text_ar: >-
        القراءة الحرارية لهذه القطعة عند سقف المؤشر. يُحسب CWSI مقابل ثابت
        جفاف مثبّت، وحرارة السطح في الصيف المصري فوق مجموع متفرق على رمل
        تتجاوزه، فتلتصق القيمة عند 1.0 للقطع المجهدة والسليمة معًا. لا
        يمكن قراءة قرار ريّ منها حتى يُعاير هذا الثابت محليًا.
