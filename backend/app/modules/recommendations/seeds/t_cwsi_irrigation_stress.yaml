    label_ar: لا إجراء — CWSI داخل نطاق هذا الحجم
    outcome:
      action_type: no_action
      severity: info
      confidence: 0.9
      parameters: {}
      text_en: >-
        CWSI is inside the range the mango index guide expects for this
        tree size.
      text_ar: >-
        CWSI داخل النطاق الذي يتوقعه دليل مؤشرات المانجو لهذا الحجم.

  leaf_size_unknown:
    label_en: No action — tree size not recorded, so there is no band to compare against
    label_ar: لا إجراء — حجم الشجرة غير مسجّل فلا يوجد نطاق للمقارنة
    outcome:
      action_type: no_action
      severity: info
      confidence: 0.9
      parameters: {}
      text_en: >-
