# mango_canopy_moisture_by_size_v1 — leaf water against the range the mango
# index guide expects for a tree of THIS size.
#
# Source: tatoo Docs/AgriPulse_Mango_Indices_Full_EN.xlsx, 10 m column.
# NDMI band per size: small -0.15–0.00, medium 0.00–0.12, large 0.11–0.27.
# The same mixed-pixel effect that shifts the vigour bands shifts these: a
# small tree's pixel is mostly dry soil, so its NORMAL moisture reading is
# negative. A single "NDMI below zero means thirsty" rule would alarm on
# every young orchard in Egypt and miss a large one drying out at 0.05.
#
# TWO NAMING TRAPS, both worth stating because getting either wrong silently
# reads the wrong band:
#
# 1. The workbook's "NDWI" row gives the formula (NIR-SWIR)/(NIR+SWIR).
#    That is NDMI (Gao 1996), not NDWI. The platform's `ndwi` is McFeeters
#    (GREEN-NIR)/(GREEN+NIR), which tracks OPEN SURFACE WATER and is a
#    different measurement entirely. The workbook says so itself in its NDMI
#    row: "Uses the exact same formula as NDWI". So this rule reads `ndmi`,
#    and a mango moisture rule must never read `ndwi`.
#
# 2. The workbook also carries MSI = SWIR/NIR. That is the same two bands as
#    NDMI and a monotonic transform of it, so there is no second opinion to
#    be had: ANDing them would be a rule ANDed with itself, and a separate
#    MSI tree would open a second card for one measurement. MSI gets no
#    tree on purpose.
#
# NDMI needs SWIR, so this is Sentinel-2 only. It fails closed on a farm with
# no S2 subscription.

code: mango_canopy_moisture_by_size_v1
name_en: Mango — canopy moisture below the expected range for the tree size
name_ar: المانجو — رطوبة المجموع دون النطاق المتوقع لحجم الشجرة
description_en: >-
  Compares canopy leaf-water (NDMI) against the range the mango index guide
  expects for a block of this tree size. A small tree's normal NDMI is
  negative because most of its pixel is bare soil, so the floor moves with
  the size. Needs the block's Tree size attribute to be set.
description_ar: >-
  يقارن ماء أوراق المجموع (NDMI) بالنطاق الذي يتوقعه دليل مؤشرات المانجو
  لقطعة بهذا حجم الأشجار. القراءة الطبيعية للشجرة الصغيرة سالبة لأن معظم
  البكسل تربة عارية، لذا يتغير الحدّ مع الحجم. يحتاج ضبط خاصية حجم الشجرة.

crop_path: mango
country_codes: [EG]
applicable_regions: []

evidence:
  confidence: medium
  notes: >-
    Floors are the lower bound of each size's 10 m NDMI band in the AgriPulse
    mango index guide, which rates NDMI itself Medium-High but states that no
    published study measures these bands for these varieties. NDMI as a
    canopy-water index is well established (Gao 1996, NDII); what is
    inferential here is the per-size band, so every floor is a tunable
    parameter and confidence is medium. Reads `ndmi`, never the platform's
    `ndwi` — see the header note.
  citations:
    - source_type: peer_reviewed
      title: >-
        Gao, B.C. — NDWI: A normalized difference water index for remote
        sensing of vegetation liquid water from space, Remote Sensing of
        Environment 58(3)
      url: https://www.sciencedirect.com/science/article/abs/pii/S0034425796000673
      year: 1996
    - source_type: government
      title: USGS — Landsat Normalized Difference Moisture Index
      url: https://www.usgs.gov/landsat-missions/normalized-difference-moisture-index
      year: 2023
    - source_type: remote_sensing
      title: >-
        AgriPulse — Comprehensive Satellite Vegetation-Index Guide for Mango
        Farms (10 m column, NDMI rows)
      url: https://agripulse.cloud/docs/mango-index-guide
      year: 2026

transferability:
  egypt: high
  middle_east: medium
  global: low

parameters:
  small_ndmi_floor:
    type: number
    default: -0.15
    min: -1.0
    max: 1.0
    description: >-
      NDMI mean below which a SMALL-tree mango block is drier than the index
      guide expects (guide band -0.15–0.00 at 10 m).
  medium_ndmi_floor:
    type: number
    default: 0.0
    min: -1.0
    max: 1.0
    description: >-
      NDMI mean below which a MEDIUM-tree mango block is drier than the index
      guide expects (guide band 0.00–0.12 at 10 m).
  large_ndmi_floor:
    type: number
    default: 0.11
    min: -1.0
    max: 1.0
    description: >-
      NDMI mean below which a LARGE-tree mango block is drier than the index
      guide expects (guide band 0.11–0.27 at 10 m).

root: size_small
nodes:
  size_small:
    label_en: Are the trees in the small size class?
    label_ar: هل الأشجار في فئة الحجم الصغير؟
    condition:
      tree:
        op: eq
        left:
          source: crop_attribute
          code: tree_size_class
          key: value
        right: small
    on_match: small_ndmi
    on_miss: size_medium

  size_medium:
    label_en: Are the trees in the medium size class?
    label_ar: هل الأشجار في فئة الحجم المتوسط؟
    condition:
      tree:
        op: eq
        left:
          source: crop_attribute
          code: tree_size_class
          key: value
        right: medium
    on_match: medium_ndmi
    on_miss: size_large

  size_large:
    label_en: Are the trees in the large size class?
    label_ar: هل الأشجار في فئة الحجم الكبير؟
    condition:
      tree:
        op: eq
        left:
          source: crop_attribute
          code: tree_size_class
          key: value
        right: large
    on_match: large_ndmi
    on_miss: leaf_size_unknown

  small_ndmi:
    label_en: Is NDMI below the small-tree floor?
    label_ar: هل NDMI دون حدّ الشجرة الصغيرة؟
    condition:
      tree:
        op: lt
        left:
          source: indices
          index_code: ndmi
          key: mean
        right:
          source: params
          name: small_ndmi_floor
    on_match: leaf_dry
    on_miss: leaf_no_action

  medium_ndmi:
    label_en: Is NDMI below the medium-tree floor?
    label_ar: هل NDMI دون حدّ الشجرة المتوسطة؟
    condition:
      tree:
        op: lt
        left:
          source: indices
          index_code: ndmi
          key: mean
        right:
          source: params
          name: medium_ndmi_floor
    on_match: leaf_dry
    on_miss: leaf_no_action

  large_ndmi:
    label_en: Is NDMI below the large-tree floor?
    label_ar: هل NDMI دون حدّ الشجرة الكبيرة؟
    condition:
      tree:
        op: lt
        left:
          source: indices
          index_code: ndmi
          key: mean
        right:
          source: params
          name: large_ndmi_floor
    on_match: leaf_dry
    on_miss: leaf_no_action

  leaf_dry:
    label_en: Canopy drier than expected for this tree size — check irrigation
    label_ar: المجموع أجفّ من المتوقع لهذا الحجم — راجع الريّ
    outcome:
      action_type: irrigate
      severity: warning
      confidence: 0.6
      valid_for_hours: 96
      parameters:
        priority: medium
        direction: increase
      text_en: >-
        Canopy leaf-water is below the range the mango index guide expects for
        a block of this tree size. Check the irrigation on this block before
        the trees show visible wilt — check the run time, the emitters, the
        line pressure and the schedule. One exception: during the cool
        pre-flowering window a dry canopy is deliberate, so read this
        alongside the stress-induction rule before adding water.
      text_ar: >-
        ماء أوراق المجموع دون النطاق الذي يتوقعه دليل مؤشرات المانجو لقطعة
        بهذا حجم الأشجار. راجع ريّ هذه القطعة قبل أن يظهر الذبول — راجع زمن
        التشغيل والنقاطات وضغط الخط والجدول. استثناء واحد: خلال نافذة ما قبل
        التزهير الباردة يكون الجفاف مقصودًا، فاقرأ هذا مع قاعدة التصويم قبل
        إضافة ماء.
      actions:
        immediate:
          - text_en: Check the block's last irrigation run and the emitter output.
            text_ar: راجع آخر ريّة للقطعة وتصريف النقاطات.
          - text_en: >-
              Confirm the block is not in the pre-flowering stress-induction
              window, where a dry canopy is intended.
            text_ar: >-
              تأكد أن القطعة ليست في نافذة التصويم قبل التزهير، حيث يكون جفاف
              المجموع مقصودًا.
        short_term:
          - text_en: Repair any irrigation fault found and restore the schedule.
            text_ar: أصلح أي عطل ريّ يُكتشف وأعد الجدول لوضعه.
        monitoring:
          - text_en: Watch NDMI recover on the next clear scene.
            text_ar: راقب تعافي NDMI في أول مشهد صافٍ قادم.

  leaf_size_unknown:
    label_en: No action — tree size not recorded, so no range to compare against
    label_ar: لا إجراء — حجم الشجرة غير مسجّل، فلا يوجد نطاق للمقارنة
    outcome:
      action_type: no_action
      severity: info
      confidence: 0.9
      parameters: {}
      text_en: >-
        This rule needs the block's Tree size attribute. Set it on the crop
        assignment and the rule will start running.
      text_ar: >-
        تحتاج هذه القاعدة خاصية حجم الشجرة للقطعة. اضبطها على تخصيص المحصول
        لتبدأ القاعدة في العمل.

  leaf_no_action:
    label_en: No action — canopy moisture within the expected range
    label_ar: لا إجراء — رطوبة المجموع ضمن النطاق المتوقع
    outcome:
      action_type: no_action
      severity: info
      confidence: 0.9
      parameters: {}
      text_en: Canopy leaf-water is within the expected range for this tree size.
      text_ar: ماء أوراق المجموع ضمن النطاق المتوقع لهذا الحجم.
