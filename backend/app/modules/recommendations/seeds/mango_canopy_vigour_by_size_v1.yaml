# mango_canopy_vigour_by_size_v1 — greenness against the range the mango
# index guide expects for a tree of THIS size.
#
# Source: tatoo Docs/AgriPulse_Mango_Indices_Full_EN.xlsx, 10 m column.
# Size is by far the biggest effect in that workbook: at the same health, a
# small mango tree over bright Egyptian sand reads NDVI 0.10–0.22 while a
# closed canopy reads 0.65–0.81. A single NDVI floor is therefore useless —
# set for a big tree it condemns every young orchard, set for a small tree it
# never notices a big one collapsing.
#
# Index choice follows the workbook's own advice rather than using one index
# throughout, because the soil fraction inside each pixel changes with size:
#
#   small  -> MSAVI  "the most accurate option for very young, newly planted
#                     trees" — solves the soil factor per pixel, nothing to tune
#   medium -> SAVI   "ignores the colour/brightness of bare soil between
#                     trees" at a fixed L=0.5
#   large  -> NDVI   canopy is closed, soil correction no longer earns its
#                    keep, and NDVI is the reading growers already know
#
# This is the ABSOLUTE-threshold companion to mango_canopy_health_v1, which
# watches the same canopy as a z-score against the block's own day-of-year
# history. They answer different questions and both are worth having: the
# z-score catches a healthy block falling, this catches a block that has been
# below its expected range all along and never had a good baseline to fall
# from. Expect them to fire together on a sharp collapse.

code: mango_canopy_vigour_by_size_v1
name_en: Mango — canopy vigour below the expected range for the tree size
name_ar: المانجو — حيوية المجموع دون النطاق المتوقع لحجم الشجرة
description_en: >-
  Compares canopy greenness against the range the mango index guide expects
  for a block of this tree size, using the index that guide recommends for
  that size (MSAVI for small trees, SAVI for medium, NDVI for large). Needs
  the block's Tree size attribute to be set.
description_ar: >-
  يقارن اخضرار المجموع بالنطاق الذي يتوقعه دليل مؤشرات المانجو لقطعة بهذا
  حجم الأشجار، باستخدام المؤشر الذي يوصي به الدليل لهذا الحجم (MSAVI للصغيرة،
  وSAVI للمتوسطة، وNDVI للكبيرة). يحتاج ضبط خاصية حجم الشجرة على القطعة.

crop_path: mango
country_codes: [EG]
applicable_regions: []

evidence:
  confidence: medium
  notes: >-
    Thresholds are the lower bound of each size's 10 m band in the AgriPulse
    mango index guide. That workbook states its own limit: no published study
    measures these indices for these varieties, and field ground-truthing is
    recommended before relying on the ranges. Confidence is therefore medium
    and every bound is a tunable parameter. The index-per-size split is
    better supported than the numbers: SAVI (L=0.5) and MSAVI2 were both
    designed for sparse cover over bright soil, which is what a young
    Egyptian mango orchard is.
  citations:
    - source_type: peer_reviewed
      title: >-
        Huete, A. — A Soil-Adjusted Vegetation Index (SAVI), Remote Sensing
        of Environment 25(3)
      url: https://www.sciencedirect.com/science/article/abs/pii/003442578890106X
      year: 1988
    - source_type: peer_reviewed
      title: >-
        Qi, J. et al. — A Modified Soil Adjusted Vegetation Index, Remote
        Sensing of Environment 48
      url: https://www.sciencedirect.com/science/article/abs/pii/0034425794901341
      year: 1994
    - source_type: remote_sensing
      title: >-
        AgriPulse — Comprehensive Satellite Vegetation-Index Guide for Mango
        Farms (10 m column, tree-size rows)
      url: https://agripulse.cloud/docs/mango-index-guide
      year: 2026

transferability:
  egypt: high
  middle_east: medium
  global: low

parameters:
  small_msavi_floor:
    type: number
    default: 0.15
    min: -1.0
    max: 1.0
    description: >-
      MSAVI mean below which a SMALL-tree mango block is under the range the
      index guide expects (guide band 0.15–0.28 at 10 m).
  medium_savi_floor:
    type: number
    default: 0.28
    min: -1.0
    max: 1.0
    description: >-
      SAVI mean below which a MEDIUM-tree mango block is under the range the
      index guide expects (guide band 0.28–0.42 at 10 m).
  large_ndvi_floor:
    type: number
    default: 0.65
    min: -1.0
    max: 1.0
    description: >-
      NDVI mean below which a LARGE-tree mango block is under the range the
      index guide expects (guide band 0.65–0.81 at 10 m).

root: size_small
nodes:
  size_small:
    label_en: Are the trees in the small size class?
    label_ar: هل الأشجار في فئة الحجم الصغير؟
    condition:
      tree:
        op: eq
        left:
          source: crop_attribute
          code: tree_size_class
          key: value
        right: small
    on_match: small_msavi
    on_miss: size_medium

  size_medium:
    label_en: Are the trees in the medium size class?
    label_ar: هل الأشجار في فئة الحجم المتوسط؟
    condition:
      tree:
        op: eq
        left:
          source: crop_attribute
          code: tree_size_class
          key: value
        right: medium
    on_match: medium_savi
    on_miss: size_large

  size_large:
    label_en: Are the trees in the large size class?
    label_ar: هل الأشجار في فئة الحجم الكبير؟
    condition:
      tree:
        op: eq
        left:
          source: crop_attribute
          code: tree_size_class
          key: value
        right: large
    on_match: large_ndvi
    on_miss: leaf_size_unknown

  small_msavi:
    label_en: Is MSAVI below the small-tree floor?
    label_ar: هل MSAVI دون حدّ الشجرة الصغيرة؟
    condition:
      tree:
        op: lt
        left:
          source: indices
          index_code: msavi
          key: mean
        right:
          source: params
          name: small_msavi_floor
    on_match: leaf_low_vigour
    on_miss: leaf_no_action

  medium_savi:
    label_en: Is SAVI below the medium-tree floor?
    label_ar: هل SAVI دون حدّ الشجرة المتوسطة؟
    condition:
      tree:
        op: lt
        left:
          source: indices
          index_code: savi
          key: mean
        right:
          source: params
          name: medium_savi_floor
    on_match: leaf_low_vigour
    on_miss: leaf_no_action

  large_ndvi:
    label_en: Is NDVI below the large-tree floor?
    label_ar: هل NDVI دون حدّ الشجرة الكبيرة؟
    condition:
      tree:
        op: lt
        left:
          source: indices
          index_code: ndvi
          key: mean
        right:
          source: params
          name: large_ndvi_floor
    on_match: leaf_low_vigour
    on_miss: leaf_no_action

  leaf_low_vigour:
    label_en: Canopy below the expected range for this tree size — scout
    label_ar: المجموع دون النطاق المتوقع لهذا الحجم — استكشف
    outcome:
      action_type: scout
      severity: warning
      confidence: 0.55
      valid_for_hours: 168
      parameters:
        priority: medium
      text_en: >-
        Canopy greenness is below the range the mango index guide expects for
        a block of this tree size. Scout for the cause — water shortage,
        root or trunk damage, pest or disease, nutrient shortage, or trees
        that failed to establish. Check the recorded Tree size first: if it
        is wrong, the comparison is wrong.
      text_ar: >-
        اخضرار المجموع دون النطاق الذي يتوقعه دليل مؤشرات المانجو لقطعة بهذا
        حجم الأشجار. استكشف السبب — نقص ماء، أو ضرر بالجذور أو الساق، أو آفة
        أو مرض، أو نقص تغذية، أو أشجار لم تنجح في التأسيس. تأكد أولًا من حجم
        الشجرة المسجّل: إن كان خطأ فالمقارنة خطأ.
      actions:
        immediate:
          - text_en: Walk the block and compare weak trees against healthy ones.
            text_ar: تجوّل في القطعة وقارن الأشجار الضعيفة بالسليمة.
          - text_en: Confirm the recorded Tree size matches what is in the ground.
            text_ar: تأكد أن حجم الشجرة المسجّل يطابق الواقع في الأرض.
        short_term:
          - text_en: >-
              Act on what the scouting finds — repair irrigation, treat the
              pest or disease, or correct the fertilization program.
            text_ar: >-
              تصرّف وفق ما يكشفه الاستكشاف — أصلح الريّ، أو عالج الآفة أو
              المرض، أو صحّح برنامج التسميد.
        monitoring:
          - text_en: Re-check the index on the next clear scene.
            text_ar: أعد فحص المؤشر في أول مشهد صافٍ قادم.

  leaf_size_unknown:
    label_en: No action — tree size not recorded, so no range to compare against
    label_ar: لا إجراء — حجم الشجرة غير مسجّل، فلا يوجد نطاق للمقارنة
    outcome:
      action_type: no_action
      severity: info
      confidence: 0.9
      parameters: {}
      text_en: >-
        This rule needs the block's Tree size attribute. Set it on the crop
        assignment and the rule will start running.
      text_ar: >-
        تحتاج هذه القاعدة خاصية حجم الشجرة للقطعة. اضبطها على تخصيص المحصول
        لتبدأ القاعدة في العمل.

  leaf_no_action:
    label_en: No action — canopy within the expected range for this tree size
    label_ar: لا إجراء — المجموع ضمن النطاق المتوقع لهذا الحجم
    outcome:
      action_type: no_action
      severity: info
      confidence: 0.9
      parameters: {}
      text_en: Canopy greenness is within the expected range for this tree size.
      text_ar: اخضرار المجموع ضمن النطاق المتوقع لهذا الحجم.
