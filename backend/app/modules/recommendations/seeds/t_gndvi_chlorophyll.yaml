# t_gndvi_chlorophyll — GNDVI against the mango index guide's band for the
# block's recorded tree size.
#
# Source: tatoo Docs/Mango indices- 28_8/AgriPulse_Mango_Indices_Plan_EN.xlsx,
# 10 m column of the three stage value sheets.
#
# Size is the axis that matters. Of the workbook's 72 index x size x
# productivity combinations, 64 hold the same range in all three stage
# sheets, so this tree takes no stage input; only CWSI and SMI genuinely
# move, and they move because irrigation is cut on purpose before harvest.
#
# GNDVI and NDRE overlap.
# Neither is a nitrogen measurement; both are chlorophyll proxies, and
# chlorophyll falls for reasons other than nitrogen.

code: t_gndvi_chlorophyll
name_en: T_GNDVI — leaf chlorophyll against the band for this tree size
name_ar: T_GNDVI — كلوروفيل الأوراق مقابل نطاق حجم الشجرة
description_en: >-
  Checks leaf chlorophyll content and leaf age, which the guide says
  separates tired old leaves from young ones better than NDVI in the later
  growth stages. Branches on the block's recorded Tree size and compares
  GNDVI against the band the guide gives for that size. Opens one card
  when the reading is below the band. Needs the Tree size attribute to be
  set on the crop assignment.
description_ar: >-
  يفحص محتوى الكلوروفيل وعمر الورقة، ويقول الدليل إنه يميّز الأوراق
  المسنّة المتعبة عن الحديثة أفضل من NDVI في مراحل النمو المتأخرة. يتفرّع
  على حجم الشجرة المسجّل للقطعة ويقارن GNDVI بالنطاق الذي يعطيه الدليل
  لهذا الحجم. يفتح بطاقة واحدة عندما تكون القراءة دون النطاق. يحتاج ضبط
  خاصية حجم الشجرة على تخصيص المحصول.

crop_path: mango
country_codes: [EG]
applicable_regions: []

evidence:
  confidence: medium
  notes: >-
    Thresholds are the actionable edge of each size's 10 m band in the
    AgriPulse mango index guide. The guide states its own limit plainly:
    no published study measures these indices for these nine mango
    varieties, and field ground-truthing is recommended before the ranges
    drive a decision. Every bound is therefore a tunable parameter, and
    small-tree results carry lower confidence because the guide grades
    every small-tree cell Low. GNDVI and NDRE overlap. Neither is a
    nitrogen measurement; both are chlorophyll proxies, and chlorophyll
    falls for reasons other than nitrogen.
  citations:
    - source_type: remote_sensing
      title: >-
        AgriPulse — Mango Indices & Agriculture Plan (English), Index
        Definitions + the three stage value sheets, 10 m column
      url: https://agripulse.cloud/docs/mango-index-guide
      year: 2026

transferability:
  egypt: high
  middle_east: medium
  global: low

parameters:
  small_gndvi_floor:
    type: number
    default: 0.12
    min: -2.0
    max: 3.0
    description: >-
      GNDVI value below which a small-tree mango block is outside the
      range the index guide expects (guide band 0.12 to 0.24 at 10 m).
  medium_gndvi_floor:
    type: number
    default: 0.3
    min: -2.0
    max: 3.0
    description: >-
      GNDVI value below which a medium-tree mango block is outside the
      range the index guide expects (guide band 0.3 to 0.45 at 10 m).
  large_gndvi_floor:
    type: number
    default: 0.59
    min: -2.0
    max: 3.0
    description: >-
      GNDVI value below which a large-tree mango block is outside the
      range the index guide expects (guide band 0.59 to 0.73 at 10 m).

root: size_small
nodes:
  size_small:
    label_en: Are the trees in the small size class?
    label_ar: هل الأشجار في فئة الحجم صغيرة؟
    condition:
      tree:
        op: eq
        left:
          source: crop_attribute
          code: tree_size_class
          key: value
        right: small
    on_match: small_check
    on_miss: size_medium

  size_medium:
    label_en: Are the trees in the medium size class?
    label_ar: هل الأشجار في فئة الحجم متوسطة؟
    condition:
      tree:
        op: eq
        left:
          source: crop_attribute
          code: tree_size_class
          key: value
        right: medium
    on_match: medium_check
    on_miss: size_large

  size_large:
    label_en: Are the trees in the large size class?
    label_ar: هل الأشجار في فئة الحجم كبيرة؟
    condition:
      tree:
        op: eq
        left:
          source: crop_attribute
          code: tree_size_class
          key: value
        right: large
    on_match: large_check
    on_miss: leaf_size_unknown

  small_check:
    label_en: Is GNDVI below the small-tree bound?
    label_ar: هل GNDVI دون حدّ الشجرة صغيرة؟
    condition:
      tree:
        op: lt
        left:
          source: indices
          index_code: gndvi
          key: mean
        right:
          source: params
          name: small_gndvi_floor
    on_match: leaf_out_of_band_small
    on_miss: leaf_in_band

  medium_check:
    label_en: Is GNDVI below the medium-tree bound?
    label_ar: هل GNDVI دون حدّ الشجرة متوسطة؟
    condition:
      tree:
        op: lt
        left:
          source: indices
          index_code: gndvi
          key: mean
        right:
          source: params
          name: medium_gndvi_floor
    on_match: leaf_out_of_band_medium
    on_miss: leaf_in_band

  large_check:
    label_en: Is GNDVI below the large-tree bound?
    label_ar: هل GNDVI دون حدّ الشجرة كبيرة؟
    condition:
      tree:
        op: lt
        left:
          source: indices
          index_code: gndvi
          key: mean
        right:
          source: params
          name: large_gndvi_floor
    on_match: leaf_out_of_band_large
    on_miss: leaf_in_band

  leaf_out_of_band_small:
    label_en: GNDVI below the small-tree band
    label_ar: GNDVI دون نطاق الشجرة صغيرة
    outcome:
      action_type: scout
      severity: info
      confidence: 0.4
      valid_for_hours: 168
      parameters:
        priority: medium
      text_en: >-
        Leaf chlorophyll is below the band the guide expects for this tree
        size. The canopy may still look full while the leaves it carries
        are old or starved. The guide's small-tree band for GNDVI at 10 m
        is 0.12 to 0.24. The guide grades every small-tree cell Low, so
        treat this as advisory and confirm on the ground.
      text_ar: >-
        الكلوروفيل دون النطاق الذي يتوقعه الدليل لهذا الحجم. قد يبدو
        المجموع ممتلئًا بينما أوراقه مسنّة أو جائعة. نطاق الدليل للشجرة
        صغيرة في GNDVI عند 10 م هو من 0.12 إلى 0.24. يصنّف الدليل كل خلايا
        الشجرة الصغيرة بثقة منخفضة، فاعتبرها استرشادية وأكّدها في الأرض.
      actions:
        immediate:
          - text_en: >-
              Read this beside T_NDRE: both low points at nutrition, GNDVI
              alone points at leaf age.
            text_ar: >-
              اقرأ هذه بجانب T_NDRE: انخفاضهما معًا يشير إلى التغذية،
              وانخفاض GNDVI وحده يشير إلى عمر الورقة.
        short_term:
          - text_en: >-
              Inspect leaf colour on the oldest flush.
            text_ar: >-
              افحص لون الأوراق على أقدم دفعة نمو.
        monitoring:
          - text_en: Re-read GNDVI on the next clear scene and check it has moved back inside the band.
            text_ar: أعد قراءة GNDVI في أول مشهد صافٍ وتأكد أنه عاد داخل النطاق.

  leaf_out_of_band_medium:
    label_en: GNDVI below the medium-tree band
    label_ar: GNDVI دون نطاق الشجرة متوسطة
    outcome:
      action_type: scout
      severity: warning
      confidence: 0.55
      valid_for_hours: 168
      parameters:
        priority: medium
      text_en: >-
        Leaf chlorophyll is below the band the guide expects for this tree
        size. The canopy may still look full while the leaves it carries
        are old or starved. The guide's medium-tree band for GNDVI at 10 m
        is 0.3 to 0.45.
      text_ar: >-
        الكلوروفيل دون النطاق الذي يتوقعه الدليل لهذا الحجم. قد يبدو
        المجموع ممتلئًا بينما أوراقه مسنّة أو جائعة. نطاق الدليل للشجرة
        متوسطة في GNDVI عند 10 م هو من 0.3 إلى 0.45.
      actions:
        immediate:
          - text_en: >-
              Read this beside T_NDRE: both low points at nutrition, GNDVI
              alone points at leaf age.
            text_ar: >-
              اقرأ هذه بجانب T_NDRE: انخفاضهما معًا يشير إلى التغذية،
              وانخفاض GNDVI وحده يشير إلى عمر الورقة.
        short_term:
          - text_en: >-
              Inspect leaf colour on the oldest flush.
            text_ar: >-
              افحص لون الأوراق على أقدم دفعة نمو.
        monitoring:
          - text_en: Re-read GNDVI on the next clear scene and check it has moved back inside the band.
            text_ar: أعد قراءة GNDVI في أول مشهد صافٍ وتأكد أنه عاد داخل النطاق.

  leaf_out_of_band_large:
    label_en: GNDVI below the large-tree band
    label_ar: GNDVI دون نطاق الشجرة كبيرة
    outcome:
      action_type: scout
      severity: warning
      confidence: 0.65
      valid_for_hours: 168
      parameters:
        priority: medium
      text_en: >-
        Leaf chlorophyll is below the band the guide expects for this tree
        size. The canopy may still look full while the leaves it carries
        are old or starved. The guide's large-tree band for GNDVI at 10 m
        is 0.59 to 0.73.
      text_ar: >-
        الكلوروفيل دون النطاق الذي يتوقعه الدليل لهذا الحجم. قد يبدو
        المجموع ممتلئًا بينما أوراقه مسنّة أو جائعة. نطاق الدليل للشجرة
        كبيرة في GNDVI عند 10 م هو من 0.59 إلى 0.73.
      actions:
        immediate:
          - text_en: >-
              Read this beside T_NDRE: both low points at nutrition, GNDVI
              alone points at leaf age.
            text_ar: >-
              اقرأ هذه بجانب T_NDRE: انخفاضهما معًا يشير إلى التغذية،
              وانخفاض GNDVI وحده يشير إلى عمر الورقة.
        short_term:
          - text_en: >-
              Inspect leaf colour on the oldest flush.
            text_ar: >-
              افحص لون الأوراق على أقدم دفعة نمو.
        monitoring:
          - text_en: Re-read GNDVI on the next clear scene and check it has moved back inside the band.
            text_ar: أعد قراءة GNDVI في أول مشهد صافٍ وتأكد أنه عاد داخل النطاق.

  leaf_in_band:
    label_en: No action — GNDVI inside the band for this tree size
    label_ar: لا إجراء — GNDVI داخل نطاق هذا الحجم
    outcome:
      action_type: no_action
      severity: info
      confidence: 0.9
      parameters: {}
      text_en: >-
        GNDVI is inside the range the mango index guide expects for this
        tree size.
      text_ar: >-
        GNDVI داخل النطاق الذي يتوقعه دليل مؤشرات المانجو لهذا الحجم.

  leaf_size_unknown:
    label_en: No action — tree size not recorded, so there is no band to compare against
    label_ar: لا إجراء — حجم الشجرة غير مسجّل فلا يوجد نطاق للمقارنة
    outcome:
      action_type: no_action
      severity: info
      confidence: 0.9
      parameters: {}
      text_en: >-
        This rule needs the block's Tree size attribute. Open the block's
        crop assignment, set Tree size, and the rule starts running on the
        next sweep.
      text_ar: >-
        تحتاج هذه القاعدة خاصية حجم الشجرة للقطعة. افتح تخصيص المحصول
        للقطعة واضبط حجم الشجرة لتبدأ القاعدة في العمل مع أول تمريرة.
