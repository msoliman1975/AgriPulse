# t_savi_canopy_vigour — SAVI against the mango index guide's band for the
# block's recorded tree size.
#
# Source: tatoo Docs/Mango indices- 28_8/AgriPulse_Mango_Indices_Plan_EN.xlsx,
# 10 m column of the three stage value sheets.
#
# Size is the axis that matters. Of the workbook's 72 index x size x
# productivity combinations, 64 hold the same range in all three stage
# sheets, so this tree takes no stage input; only CWSI and SMI genuinely
# move, and they move because irrigation is cut on purpose before harvest.
#
# L = 0.5 is a middle setting for partial cover.
# A very young orchard is better read by MSAVI, which solves the soil factor
# per pixel.

code: t_savi_canopy_vigour
name_en: T_SAVI — soil-adjusted vigour against the band for this tree size
name_ar: T_SAVI — الحيوية المصححة للتربة مقابل نطاق حجم الشجرة
description_en: >-
  Checks canopy vigour with the brightness of the bare soil between the
  trees discounted at a fixed soil factor of L = 0.5. Branches on the
  block's recorded Tree size and compares SAVI against the band the guide
  gives for that size. Opens one card when the reading is below the band.
  Needs the Tree size attribute to be set on the crop assignment.
description_ar: >-
  يفحص حيوية المجموع مع خصم سطوع التربة العارية بين الأشجار بمعامل تربة
  ثابت L = 0.5. يتفرّع على حجم الشجرة المسجّل للقطعة ويقارن SAVI بالنطاق
  الذي يعطيه الدليل لهذا الحجم. يفتح بطاقة واحدة عندما تكون القراءة دون
  النطاق. يحتاج ضبط خاصية حجم الشجرة على تخصيص المحصول.

crop_path: mango
country_codes: [EG]
applicable_regions: []

evidence:
  confidence: medium
  notes: >-
    Thresholds are the actionable edge of each size's 10 m band in the
    AgriPulse mango index guide. The guide states its own limit plainly:
    no published study measures these indices for these nine mango
    varieties, and field ground-truthing is recommended before the ranges
    drive a decision. Every bound is therefore a tunable parameter, and
    small-tree results carry lower confidence because the guide grades
    every small-tree cell Low. L = 0.5 is a middle setting for partial
    cover. A very young orchard is better read by MSAVI, which solves the
    soil factor per pixel.
  citations:
    - source_type: remote_sensing
      title: >-
        AgriPulse — Mango Indices & Agriculture Plan (English), Index
        Definitions + the three stage value sheets, 10 m column
      url: https://agripulse.cloud/docs/mango-index-guide
      year: 2026

transferability:
  egypt: high
  middle_east: medium
  global: low

parameters:
  small_savi_floor:
    type: number
    default: 0.12
    min: -2.0
    max: 3.0
    description: >-
      SAVI value below which a small-tree mango block is outside the range
      the index guide expects (guide band 0.12 to 0.24 at 10 m).
  medium_savi_floor:
    type: number
    default: 0.28
    min: -2.0
    max: 3.0
    description: >-
      SAVI value below which a medium-tree mango block is outside the
      range the index guide expects (guide band 0.28 to 0.42 at 10 m).
  large_savi_floor:
    type: number
    default: 0.54
    min: -2.0
    max: 3.0
    description: >-
      SAVI value below which a large-tree mango block is outside the range
      the index guide expects (guide band 0.54 to 0.7 at 10 m).

root: size_small
nodes:
  size_small:
    label_en: Are the trees in the small size class?
    label_ar: هل الأشجار في فئة الحجم صغيرة؟
    condition:
      tree:
        op: eq
        left:
          source: crop_attribute
          code: tree_size_class
          key: value
        right: small
    on_match: small_check
    on_miss: size_medium

  size_medium:
    label_en: Are the trees in the medium size class?
    label_ar: هل الأشجار في فئة الحجم متوسطة؟
    condition:
      tree:
        op: eq
        left:
          source: crop_attribute
          code: tree_size_class
          key: value
        right: medium
    on_match: medium_check
    on_miss: size_large

  size_large:
    label_en: Are the trees in the large size class?
    label_ar: هل الأشجار في فئة الحجم كبيرة؟
    condition:
      tree:
        op: eq
        left:
          source: crop_attribute
          code: tree_size_class
          key: value
        right: large
    on_match: large_check
    on_miss: leaf_size_unknown

  small_check:
    label_en: Is SAVI below the small-tree bound?
    label_ar: هل SAVI دون حدّ الشجرة صغيرة؟
    condition:
      tree:
        op: lt
        left:
          source: indices
          index_code: savi
          key: mean
        right:
          source: params
          name: small_savi_floor
    on_match: leaf_out_of_band_small
    on_miss: leaf_in_band

  medium_check:
    label_en: Is SAVI below the medium-tree bound?
    label_ar: هل SAVI دون حدّ الشجرة متوسطة؟
    condition:
      tree:
        op: lt
        left:
          source: indices
          index_code: savi
          key: mean
        right:
          source: params
          name: medium_savi_floor
    on_match: leaf_out_of_band_medium
    on_miss: leaf_in_band

  large_check:
    label_en: Is SAVI below the large-tree bound?
    label_ar: هل SAVI دون حدّ الشجرة كبيرة؟
    condition:
      tree:
        op: lt
        left:
          source: indices
          index_code: savi
          key: mean
        right:
          source: params
          name: large_savi_floor
    on_match: leaf_out_of_band_large
    on_miss: leaf_in_band

  leaf_out_of_band_small:
    label_en: SAVI below the small-tree band
    label_ar: SAVI دون نطاق الشجرة صغيرة
    outcome:
      action_type: scout
      severity: info
      confidence: 0.4
      valid_for_hours: 168
      parameters:
        priority: medium
      text_en: >-
        SAVI is below the band the guide expects for this tree size.
        Because SAVI already discounts the soil, this is a canopy signal
        and not a soil-brightness artefact. The guide's small-tree band
        for SAVI at 10 m is 0.12 to 0.24. The guide grades every
        small-tree cell Low, so treat this as advisory and confirm on the
        ground.
      text_ar: >-
        قيمة SAVI دون النطاق الذي يتوقعه الدليل لهذا الحجم. ولأن SAVI يخصم
        أثر التربة أصلًا، فهذه إشارة من المجموع لا أثر لسطوع التربة. نطاق
        الدليل للشجرة صغيرة في SAVI عند 10 م هو من 0.12 إلى 0.24. يصنّف
        الدليل كل خلايا الشجرة الصغيرة بثقة منخفضة، فاعتبرها استرشادية
        وأكّدها في الأرض.
      actions:
        immediate:
          - text_en: >-
              Scout the block for the cause of the weak canopy.
            text_ar: >-
              استكشف القطعة لمعرفة سبب ضعف المجموع.
        short_term:
          - text_en: >-
              Compare against T_BSI: if bare soil is also high, the block
              may have lost trees rather than weakened them.
            text_ar: >-
              قارن مع T_BSI: إذا كانت التربة العارية مرتفعة أيضًا فربما
              فقدت القطعة أشجارًا بدل أن تضعف.
        monitoring:
          - text_en: Re-read SAVI on the next clear scene and check it has moved back inside the band.
            text_ar: أعد قراءة SAVI في أول مشهد صافٍ وتأكد أنه عاد داخل النطاق.

  leaf_out_of_band_medium:
    label_en: SAVI below the medium-tree band
    label_ar: SAVI دون نطاق الشجرة متوسطة
    outcome:
      action_type: scout
      severity: warning
      confidence: 0.55
      valid_for_hours: 168
      parameters:
        priority: medium
      text_en: >-
        SAVI is below the band the guide expects for this tree size.
        Because SAVI already discounts the soil, this is a canopy signal
        and not a soil-brightness artefact. The guide's medium-tree band
        for SAVI at 10 m is 0.28 to 0.42.
      text_ar: >-
        قيمة SAVI دون النطاق الذي يتوقعه الدليل لهذا الحجم. ولأن SAVI يخصم
        أثر التربة أصلًا، فهذه إشارة من المجموع لا أثر لسطوع التربة. نطاق
        الدليل للشجرة متوسطة في SAVI عند 10 م هو من 0.28 إلى 0.42.
      actions:
        immediate:
          - text_en: >-
              Scout the block for the cause of the weak canopy.
            text_ar: >-
              استكشف القطعة لمعرفة سبب ضعف المجموع.
        short_term:
          - text_en: >-
              Compare against T_BSI: if bare soil is also high, the block
              may have lost trees rather than weakened them.
            text_ar: >-
              قارن مع T_BSI: إذا كانت التربة العارية مرتفعة أيضًا فربما
              فقدت القطعة أشجارًا بدل أن تضعف.
        monitoring:
          - text_en: Re-read SAVI on the next clear scene and check it has moved back inside the band.
            text_ar: أعد قراءة SAVI في أول مشهد صافٍ وتأكد أنه عاد داخل النطاق.

  leaf_out_of_band_large:
    label_en: SAVI below the large-tree band
    label_ar: SAVI دون نطاق الشجرة كبيرة
    outcome:
      action_type: scout
      severity: warning
      confidence: 0.65
      valid_for_hours: 168
      parameters:
        priority: medium
      text_en: >-
        SAVI is below the band the guide expects for this tree size.
        Because SAVI already discounts the soil, this is a canopy signal
        and not a soil-brightness artefact. The guide's large-tree band
        for SAVI at 10 m is 0.54 to 0.7.
      text_ar: >-
        قيمة SAVI دون النطاق الذي يتوقعه الدليل لهذا الحجم. ولأن SAVI يخصم
        أثر التربة أصلًا، فهذه إشارة من المجموع لا أثر لسطوع التربة. نطاق
        الدليل للشجرة كبيرة في SAVI عند 10 م هو من 0.54 إلى 0.7.
      actions:
        immediate:
          - text_en: >-
              Scout the block for the cause of the weak canopy.
            text_ar: >-
              استكشف القطعة لمعرفة سبب ضعف المجموع.
        short_term:
          - text_en: >-
              Compare against T_BSI: if bare soil is also high, the block
              may have lost trees rather than weakened them.
            text_ar: >-
              قارن مع T_BSI: إذا كانت التربة العارية مرتفعة أيضًا فربما
              فقدت القطعة أشجارًا بدل أن تضعف.
        monitoring:
          - text_en: Re-read SAVI on the next clear scene and check it has moved back inside the band.
            text_ar: أعد قراءة SAVI في أول مشهد صافٍ وتأكد أنه عاد داخل النطاق.

  leaf_in_band:
    label_en: No action — SAVI inside the band for this tree size
    label_ar: لا إجراء — SAVI داخل نطاق هذا الحجم
    outcome:
      action_type: no_action
      severity: info
      confidence: 0.9
      parameters: {}
      text_en: >-
        SAVI is inside the range the mango index guide expects for this
        tree size.
      text_ar: >-
        SAVI داخل النطاق الذي يتوقعه دليل مؤشرات المانجو لهذا الحجم.

  leaf_size_unknown:
    label_en: No action — tree size not recorded, so there is no band to compare against
    label_ar: لا إجراء — حجم الشجرة غير مسجّل فلا يوجد نطاق للمقارنة
    outcome:
      action_type: no_action
      severity: info
      confidence: 0.9
      parameters: {}
      text_en: >-
        This rule needs the block's Tree size attribute. Open the block's
        crop assignment, set Tree size, and the rule starts running on the
        next sweep.
      text_ar: >-
        تحتاج هذه القاعدة خاصية حجم الشجرة للقطعة. افتح تخصيص المحصول
        للقطعة واضبط حجم الشجرة لتبدأ القاعدة في العمل مع أول تمريرة.
