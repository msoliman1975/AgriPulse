# capabilities.yaml â€” canonical capability list for AgriPulse RBAC.
#
# Naming: "<resource>.<action>". `<resource>` is the noun owning the data;
# `<action>` is what is being done to/with it. Capability names are stable
# strings â€” add new ones, never rename existing ones.
#
# Fields:
#   description : human-readable, audit-friendly summary
#   scope       : which JWT layer can grant this capability
#                   - platform : only PlatformRole grants
#                   - tenant   : TenantRole or PlatformRole grants
#                   - farm     : FarmScope, TenantRole, or PlatformRole grants
#                 The resolver in check.py treats `scope` as documentation;
#                 enforcement uses role_capabilities.yaml.
#   status      : active = a route enforces this capability today
#                 stub   = reserved for a module not yet built (data_model
#                          documents the resource; the route will appear
#                          in a later prompt)
#
# See ARCHITECTURE.md Â§ 7 and data_model.md Â§ 4.

capabilities:
  # --- Platform admin --------------------------------------------------
  platform.read:
    description: Read platform-wide resources (tenant list, system status).
    scope: platform
    status: active
  platform.manage_tenants:
    description: Create, suspend, restore, or delete tenants.
    scope: platform
    status: active
  platform.impersonate_tenant:
    description: Issue a support-scoped token for a tenant. Always audited.
    scope: platform
    status: stub

  # --- Tenant ----------------------------------------------------------
  tenant.read:
    description: Read tenant profile, plan, and settings.
    scope: tenant
    status: active
  tenant.update:
    description: Update tenant profile (name, contact, locale defaults).
    scope: tenant
    status: active
  tenant.manage_settings:
    description: Edit tenant-level settings (cloud-cover thresholds, defaults).
    scope: tenant
    status: active
  tenant.transfer_ownership:
    description: Reassign the single TenantOwner role.
    scope: tenant
    status: active

  # --- Subscription / billing ------------------------------------------
  subscription.read:
    description: Read the active subscription, plan, and invoice history.
    scope: tenant
    status: active
  subscription.manage:
    description: Change plan or payment method, cancel or reactivate.
    scope: tenant
    status: active

  # --- IAM (users, roles, scopes) --------------------------------------
  user.read:
    description: List users in the tenant and read their profiles.
    scope: tenant
    status: active
  user.invite:
    description: Invite a new user to the tenant.
    scope: tenant
    status: active
  # Farm-scoped sibling of user.invite. Enrolling a scout reaches exactly one
  # farm, and the person who should do it is the manager standing with the
  # crew — not head office. Kept separate from user.invite rather than
  # widening it, because inviting an Agronomist reaches the whole tenant.
  user.field_enrol:
    description: Enrol a field worker on a farm with a phone and a PIN, and re-issue their PIN.
    scope: farm
    status: active
  user.update:
    description: Edit a user's profile (name, phone) within the tenant.
    scope: tenant
    status: active
  user.suspend:
    description: Suspend or reactivate a user's tenant membership.
    scope: tenant
    status: active
  user.delete:
    description: Hard-delete a user from the tenant (GDPR-style).
    scope: tenant
    status: active
  role.assign_tenant:
    description: Grant or revoke a tenant-wide role.
    scope: tenant
    status: active

  # --- Platform admin + tenant integrations ---------------------------
  platform.manage_defaults:
    description: Edit platform-wide default settings.
    scope: platform
    status: active
  platform.manage_tenant_admins:
    description: Add, remove, or transfer-ownership of tenant admins on any tenant.
    scope: platform
    status: active
  platform.run_backfill:
    # Deliberately platform-only: backfill spends a shared CDSE processing-unit
    # allowance, so until per-tenant quota accounting exists one tenant could
    # exhaust it for everyone.
    description: Trigger historical imagery/weather backfill and index computation on any tenant.
    scope: platform
    status: active
  platform.observe_pipeline:
    # Read-only, and deliberately NOT folded into platform.run_backfill.
    # Observer only looks: seeing that a number is wrong must not imply the
    # right to spend the shared CDSE allowance re-computing it. The one
    # exception (verify runs, which consume worker time) is audited.
    description: Inspect the indices pipeline end-to-end on any tenant — scenes, pixels, aggregates, lineage.
    scope: platform
    status: active
  platform.manage_platform_admins:
    description: Add or remove platform admins (PlatformAdmin / PlatformSupport).
    scope: platform
    status: active
  platform.purge_data:
    # Deliberately NOT folded into platform.manage_tenants. Purge is the only
    # irreversible delete in the product — it removes rows, object-storage
    # assets and STAC records with no undo — so it must be withholdable from
    # someone who otherwise administers tenants. Phase 2 extends a farm/block
    # subset of this to TenantAdmin; tenants never get tenant-level purge.
    description: Permanently purge a block, farm, or tenant and everything it owns.
    scope: platform
    status: active
  platform.manage_crops:
    description: Create, edit, or retire crops, varieties, and strains in the catalog.
    scope: platform
    status: active
  platform.manage_countries:
    description: Create, edit, or retire countries in the catalog.
    scope: platform
    status: active
  plan_template.manage:
    description: Author platform-curated plan templates (create, edit, publish, archive).
    scope: platform
    status: active
  signal.platform.manage:
    description: Author platform-curated signal definitions and templates (the shared catalog every tenant reads).
    scope: platform
    status: active
  tenant.manage_integrations:
    description: Edit weather, imagery, email, and webhook configs at any inheritance tier.
    scope: tenant
    status: active
  tenant.read_integration_health:
    description: View integration sync status and recent errors at Farm + Block level.
    scope: tenant
    status: active
  role.assign_farm:
    description: Grant or revoke a farm-scoped role.
    scope: farm
    status: active

  # --- Farms / blocks --------------------------------------------------
  farm.read:
    description: View farm metadata and the farm's block list.
    scope: farm
    status: active
  farm.create:
    description: Create a new farm in the tenant.
    scope: tenant
    status: active
  farm.update:
    description: Edit farm metadata (name, governorate, contact, geometry).
    scope: farm
    status: active
  farm.delete:
    description: Soft-archive a farm.
    scope: farm
    status: active
  farm.member.read:
    description: List members assigned to a specific farm.
    scope: farm
    status: active
  farm.attachment.read:
    description: View a farm's photos and documents.
    scope: farm
    status: active
  farm.attachment.write:
    description: Upload or remove a farm's photos and documents.
    scope: farm
    status: active
  block.read:
    description: View block metadata, geometry, and crop assignments.
    scope: farm
    status: active
  block.create:
    description: Create a new block in a farm.
    scope: farm
    status: active
  block.update_geometry:
    description: Edit a block's polygon geometry.
    scope: farm
    status: active
  block.update_metadata:
    description: Edit non-geometry block fields (name, soil, irrigation).
    scope: farm
    status: active
  block.delete:
    description: Soft-archive a block.
    scope: farm
    status: active
  block.attachment.read:
    description: View a block's photos and documents.
    scope: farm
    status: active
  block.attachment.write:
    description: Upload or remove a block's photos and documents.
    scope: farm
    status: active
  farm.manage_config:
    description: Edit farm-level config templates (subscriptions, irrigation,
      org) and per-category lock state. Granted to FarmManager + TenantAdmin.
      Storage lands in PR-1; authoring and lock semantics arrive in PR-2/PR-3
      of the farm-block-config-model rollout.
    scope: farm
    status: stub
  crop_assignment.create:
    description: Assign a crop to a block for a season.
    scope: farm
    status: active
  crop_assignment.update:
    description: Edit an existing crop assignment.
    scope: farm
    status: active
  crop_assignment.delete:
    description: Remove a crop assignment.
    scope: farm
    status: active

  # --- Imagery & indices -----------------------------------------------
  imagery.read:
    description: View imagery metadata and request rendered tiles.
    scope: farm
    status: active
  imagery.refresh:
    description: Trigger an on-demand imagery refresh for a block.
    scope: farm
    status: active
  imagery.subscription.manage:
    description: Subscribe a block to an imagery product or revoke a subscription.
    scope: farm
    status: active
  index.read:
    description: View pre-computed and aggregated index values.
    scope: farm
    status: active
  index.compute_custom:
    description: Run a custom on-demand index calculation.
    scope: farm
    status: active

  # --- Weather ---------------------------------------------------------
  weather.read:
    description: View weather observations, forecasts, and derived signals.
    scope: farm
    status: active
  weather.refresh:
    description: Trigger an on-demand weather refresh for a block.
    scope: farm
    status: active
  weather.subscription.manage:
    description: Subscribe a block to a weather provider or revoke a subscription.
    scope: farm
    status: active
  weather_risk.read:
    description: View weather-driven disease/pest risk scores per block.
    scope: farm
    status: active

  # --- Custom signals --------------------------------------------------
  signal.read:
    description: View signal definitions and observations.
    scope: farm
    status: active
  signal.define:
    description: Create or edit a custom signal definition.
    scope: tenant
    status: active
  signal.record:
    description: Record an observation against an existing signal.
    scope: farm
    status: active
  # CS-1 D5. Recording an observation is a routine field action
  # (signal.record above); deleting one is an admin correction path,
  # so it gets its own capability that we can grant separately.
  signal.delete_observation:
    description: Delete a previously-recorded signal observation.
    scope: tenant
    status: active

  # --- Vegetation plans ------------------------------------------------
  plan.read:
    description: View vegetation plans + scheduled activities.
    scope: farm
    status: active
  plan.manage:
    description: Create, edit, or archive vegetation plans + their activities.
    scope: farm
    status: active
  plan_activity.complete:
    description: Mark a scheduled activity as completed or skipped.
    scope: farm
    status: active
  plan_template.read:
    description: View appliable plan templates + preview their schedule for a farm.
    scope: farm
    status: active
  plan_template.apply:
    description: Apply a plan template to a farm's matching-crop blocks.
    scope: farm
    status: active

  # --- Resources (workers + equipment catalog) -------------------------
  resource.read:
    description: View workers and equipment on a farm.
    scope: farm
    status: active
  resource.manage:
    description: Create, edit, archive, attach, or detach workers / equipment.
    scope: farm
    status: active

  # --- Irrigation schedules --------------------------------------------
  irrigation.schedule.read:
    description: View model-driven irrigation recommendations.
    scope: farm
    status: active
  irrigation.schedule.manage:
    description: Generate / apply / skip irrigation recommendations.
    scope: farm
    status: active

  # --- Alerts ----------------------------------------------------------
  alert.read:
    description: View open and historical alerts.
    scope: farm
    status: active
  alert.acknowledge:
    description: Acknowledge an open alert.
    scope: farm
    status: active
  alert.resolve:
    description: Mark an alert resolved (with optional comment).
    scope: farm
    status: active
  alert.snooze:
    description: Snooze an alert for a defined window.
    scope: farm
    status: active
  alert_rule.read:
    description: View alert rule definitions.
    scope: farm
    status: active
  alert_rule.manage:
    description: Create, edit, or delete alert rules.
    scope: tenant
    status: active

  # --- Recommendations -------------------------------------------------
  recommendation.read:
    description: View recommendations.
    scope: farm
    status: active
  recommendation.act:
    description: Apply, dismiss, or defer a recommendation.
    scope: farm
    status: active
  decision_tree.read:
    description: View decision tree definitions.
    scope: tenant
    status: active
  decision_tree.manage:
    description: Author or publish decision trees within the tenant.
    scope: tenant
    status: active

  # --- Operational records ---------------------------------------------
  irrigation.record:
    description: Log an irrigation event.
    scope: farm
    status: stub
  fertilization.record:
    description: Log a fertilization event.
    scope: farm
    status: stub
  scouting.record:
    description: Log a scouting observation (notes, photos).
    scope: farm
    status: active
  scouting.visit.read:
    description: See scouting visits on an assigned farm.
    scope: farm
    status: active
  scouting.visit.claim:
    description: Claim, accept, decline or start a scouting visit offered to you.
    scope: farm
    status: active
  scouting.visit.complete:
    description: Submit observations and close a scouting visit.
    scope: farm
    status: active
  scouting.visit.assign:
    description: Assign, reassign or cancel a scouting visit for someone else.
    scope: farm
    status: active
  scouting.dispatch:
    description: Raise an ad-hoc scouting visit from the map, with your own instructions.
    scope: farm
    status: active
  scouting.rule.manage:
    description: Edit scouting routing rules and routine schedules.
    scope: farm
    status: active

  # --- Analytics & reports ---------------------------------------------
  analytics.read:
    description: View dashboards, charts, and aggregations.
    scope: farm
    status: stub
  analytics.export:
    description: Download bulk exports (CSV, GeoTIFF).
    scope: farm
    status: stub

  # --- Notifications ---------------------------------------------------
  notification.read_inbox:
    description: Read one's own in-app notification inbox.
    scope: tenant
    status: active
  notification.write_inbox:
    description: Mark one's own inbox items read or archived.
    scope: tenant
    status: active
  notification.manage_templates:
    description: Edit notification templates.
    scope: tenant
    status: stub

  # --- Audit -----------------------------------------------------------
  audit.read:
    description: Read the tenant's audit log.
    scope: tenant
    status: active
